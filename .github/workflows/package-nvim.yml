name: Package Neovim Configuration

on:
  push:
    branches: ['main']
    paths:
      - 'ansible/roles/dotfiles/files/home/.config/nvim/**'
      - '.github/workflows/package-nvim.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'ansible/roles/dotfiles/files/home/.config/nvim/**'
      - '.github/workflows/package-nvim.yml'

concurrency:
  group: nvim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    # Skip on non-GitHub forges (e.g. Gitea, which also scans .github/workflows).
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Package Neovim configuration
        run: tar -czf nvim.tar.gz -C ansible/roles/dotfiles/files/home .config/nvim

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nvim-package
          path: nvim.tar.gz
