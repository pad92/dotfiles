---
default_install_hook_types: ['pre-commit', 'commit-msg', 'post-commit']
repos:
  # Regenerate the static documentation preview (public/) after each commit.
  # public/ is gitignored, so this only refreshes the local preview.
  - repo: local
    hooks:
      - id: test
        name: run unit and shell tests
        language: system
        entry: env -u GIT_INDEX_FILE make test
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: lint-ansible
        name: validate Ansible configuration
        language: system
        entry: make lint-ansible
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: test-gen-pages
        name: test documentation page generator
        language: system
        entry: python3 scripts/ci/test_gen_pages.py
        files: ^scripts/ci/(gen_pages|test_gen_pages)\.py$
        pass_filenames: false
        stages: [pre-commit]

      - id: build-pages
        name: build documentation pages (public/)
        language: system
        entry: scripts/ci/build_pages.sh
        always_run: true
        pass_filenames: false
        stages: [post-commit]
        verbose: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # File size checks
      - id: check-added-large-files
        args: [--maxkb=500]

      # Syntax checks
      - id: check-json
      - id: check-xml
      - id: check-yaml
      - id: check-toml

      # Whitespace and formatting
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: end-of-file-fixer
        exclude: 'ansible/roles/dotfiles/files/home/.config/nvim/lazy-lock.json'

      # Script and executable checks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks

      # Security leak detection
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, ansible/roles/dotfiles/files/home/.config/yamllint/config]

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.3.1
    hooks:
      - id: stylua-github
        args:
          [
            --config-path,
            ansible/roles/dotfiles/files/home/.config/nvim/stylua.toml,
          ]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        exclude: '(ansible/roles/dotfiles/files/home/.config/nvim/lazy-lock.json|^install.conf.yaml$)'
        args:
          [
            --print-width=80,
            --tab-width=2,
            --single-quote=true,
            --trailing-comma=es5,
          ]

  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      - id: typos

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: 'ansible/roles/dotfiles/files/home/.config/nvim/lazy-lock.json'

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        args: [--verbose, --report-format=json]

  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  # Language-specific linters that respect editorconfig
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args: [--max-line-length=88, '--extend-ignore=E203,W503,E501']
        # steam-optimize has a separate formatting follow-up; exclude vendored Zsh plugins.
        exclude: ^(ansible/roles/dotfiles/files/home/\.bin/steam-optimize|ansible/roles/dotfiles/files/home/zsh/)

  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        args: [--line-length=88]
        exclude: ^(ansible/roles/dotfiles/files/home/\.bin/steam-optimize|ansible/roles/dotfiles/files/home/zsh/)

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: [--severity=warning, --exclude=SC2207, --exclude=SC2034]
        # shellcheck does not support zsh syntax (glob qualifiers, etc.)
        exclude: '(\.zsh$|^home/\.zshrc$|^home/\.zshenv$|^home/\.zprofile$)'
