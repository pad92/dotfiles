---
# Documentation GitLab CI : https://docs.gitlab.com/ee/ci/

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

stages:
  - test
  - validate
  - package
  - pages
  - release

unit_tests:
  stage: test
  image: python:3.13-alpine
  before_script:
    - apk add --no-cache bash zsh coreutils findutils grep file flock imagemagick git
    - python3 -m pip install --no-cache-dir -r requirements-test.txt
  script:
    - python3 -m unittest discover -s tests -p 'test_*.py'
    - bash tests/awww-monitor-scale.sh
    - bash tests/hyprlock-playerctlock.sh
    - zsh tests/arch-clean-no-orphans.zsh
    - zsh tests/git-pull-recursive.zsh

ansible_lint:
  stage: validate
  image: python:3.13-slim
  before_script:
    - >-
      apt-get update && apt-get install -y --no-install-recommends make
      && rm -rf /var/lib/apt/lists/*
    - python -m pip install --no-cache-dir -r requirements-ansible.txt
    - export ANSIBLE_CONFIG="$CI_PROJECT_DIR/ansible.cfg"
    # The lint job does not decrypt Vault data but the config requires this file.
    - printf '%s\n' 'ci-lint-placeholder' > .vault
    - ansible-galaxy collection install -r ansible/requirements.yml
  script:
    - make lint-ansible

# Le SAST tourne par défaut sure tous les commits
sast:
  stage: test

# Job Vim : Se lance uniquement si la conf Vim change
package_vim:
  stage: package
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - tar -czf vim.tar.gz -C ansible/roles/dotfiles/files/home .vim .vimrc
  artifacts:
    paths:
      - vim.tar.gz

# Job Neovim : Archive la configuration Neovim
package_nvim:
  stage: package
  script:
    - tar -czf nvim.tar.gz -C ansible/roles/dotfiles/files/home .config/nvim
  artifacts:
    paths:
      - nvim.tar.gz

.pages_build:
  stage: pages
  image: alpine:latest
  script:
    - apk add --no-cache python3 py3-markdown
    - sh scripts/ci/build_pages.sh
  artifacts:
    paths:
      - public

# Job Pages : Génère et déploie la documentation sur main et les tags de release
pages:
  extends: .pages_build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - 'README.md'
        - 'CHANGELOG.md'
        - 'dist/arch/install.md'
        - 'scripts/ci/style.css'
        - 'scripts/ci/gen_pages.py'
        - 'scripts/ci/build_pages.sh'
        - '.github/workflows/README.md'
        - '.gitlab/README.md'
        - '.gitlab-ci.yml'

# Job de validation Pages : construct les docs sur les branches non-déployées
build_pages_review:
  extends: .pages_build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - 'README.md'
        - 'CHANGELOG.md'
        - 'dist/arch/install.md'
        - 'scripts/ci/style.css'
        - 'scripts/ci/gen_pages.py'
        - 'scripts/ci/build_pages.sh'
        - '.github/workflows/README.md'
        - '.gitlab/README.md'
  artifacts:
    paths:
      - public
    expire_in: 1 week

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - sh scripts/ci/extract_release_notes.sh "$CI_COMMIT_TAG" > release_notes.txt
    - release-cli create --name "$CI_COMMIT_TAG" --description "$(cat release_notes.txt)"
