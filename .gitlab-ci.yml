---
# Documentation GitLab CI : https://docs.gitlab.com/ee/ci/

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml

default:
  tags:
    - chataigne

stages:
  - test
  - validate
  - package
  - pages
  - release

unit_tests:
  stage: test
  image: python:3.13-alpine
  before_script:
    - apk add --no-cache bash zsh coreutils findutils grep file flock imagemagick git jq make lua5.4
    - python3 -m pip install --no-cache-dir -r requirements-test.txt
    # Some tests load roles that use pinned collection modules; without them
    # Ansible cannot resolve those tasks and the tests are skipped or fail.
    - ansible-galaxy collection install -r ansible/requirements.yml -p .ansible/collections
  script:
    # One process per test file on every runner CPU; see the script header.
    - scripts/ci/run_unit_tests.sh --coverage
    - python3 -m coverage report
    - python3 -m coverage xml -o coverage.xml
    - bash tests/awww-monitor-scale.sh
    - bash tests/hyprlock-playerctlock.sh
    - bash tests/claude-statusline.sh
    - bash tests/hypr-screenshot.sh
    - bash tests/hypr-record.sh
    - zsh tests/arch-clean-no-orphans.zsh
    - zsh tests/git-pull-recursive.zsh
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

ansible_lint:
  stage: validate
  image: python:3.13-slim
  before_script:
    - >-
      apt-get update && apt-get install -y --no-install-recommends make
      && rm -rf /var/lib/apt/lists/*
    - python -m pip install --no-cache-dir -r requirements-ansible.txt
    - export ANSIBLE_CONFIG="$CI_PROJECT_DIR/ansible.cfg"
    - ansible-galaxy collection install -r ansible/requirements.yml
  script:
    - make lint-ansible

.package_config:
  stage: package
  script:
    - tar -czf "$PACKAGE_ARCHIVE" -C ansible/roles/dotfiles/files/home $PACKAGE_PATHS
  artifacts:
    paths:
      - '$PACKAGE_ARCHIVE'

# Les archives Vim et Neovim sont maintenues sur la branche par défaut pour
# alimenter leurs URLs publiques ; ailleurs, elles ne sont construites que si
# leur configuration change.
package_vim:
  extends: .package_config
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    PACKAGE_ARCHIVE: vim.tar.gz
    PACKAGE_PATHS: .vim .vimrc
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - 'ansible/roles/dotfiles/files/home/.vim/**/*'
        - 'ansible/roles/dotfiles/files/home/.vimrc'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      changes:
        - 'ansible/roles/dotfiles/files/home/.vim/**/*'
        - 'ansible/roles/dotfiles/files/home/.vimrc'

package_nvim:
  extends: .package_config
  variables:
    PACKAGE_ARCHIVE: nvim.tar.gz
    PACKAGE_PATHS: .config/nvim
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - 'ansible/roles/dotfiles/files/home/.config/nvim/**/*'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      changes:
        - 'ansible/roles/dotfiles/files/home/.config/nvim/**/*'

.pages_build:
  stage: pages
  image: alpine:latest
  script:
    - apk add --no-cache python3 py3-markdown
    - sh scripts/ci/build_pages.sh
  artifacts:
    paths:
      - public

# Job Pages : Génère et déploie la documentation sur main et les tags de release
pages:
  extends: .pages_build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        # Tous les Markdown sont publiés (voir scripts/ci/gen_pages.py).
        - '**/*.md'
        # Les images liées sont aussi copiées dans le site (ASSET_EXTENSIONS).
        - '**/*.gif'
        - '**/*.jpeg'
        - '**/*.jpg'
        - '**/*.png'
        - '**/*.svg'
        - '**/*.webp'
        - 'scripts/ci/style.css'
        - 'scripts/ci/gen_pages.py'
        - 'scripts/ci/build_pages.sh'
        - '.gitlab-ci.yml'

# Job de validation Pages : construct les docs sur les branches non-déployées
build_pages_review:
  extends: .pages_build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        # Tous les Markdown sont publiés (voir scripts/ci/gen_pages.py).
        - '**/*.md'
        # Les images liées sont aussi copiées dans le site (ASSET_EXTENSIONS).
        - '**/*.gif'
        - '**/*.jpeg'
        - '**/*.jpg'
        - '**/*.png'
        - '**/*.svg'
        - '**/*.webp'
        - 'scripts/ci/style.css'
        - 'scripts/ci/gen_pages.py'
        - 'scripts/ci/build_pages.sh'
  artifacts:
    paths:
      - public
    expire_in: 1 week

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - sh scripts/ci/extract_release_notes.sh "$CI_COMMIT_TAG" > release_notes.txt
    - release-cli create --name "$CI_COMMIT_TAG" --description "$(cat release_notes.txt)"
