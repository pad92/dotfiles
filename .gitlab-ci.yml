---
# Documentation GitLab CI : https://docs.gitlab.com/ee/ci/

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml

default:
  tags:
    - chataigne

stages:
  - test
  - validate
  - package
  - pages
  - release

# Les tests ne lisent que le code, les rôles, les scripts et leur outillage :
# une modification limitée à la documentation ou aux fichiers statiques ne les relance
# pas. La branche par défaut, les tags et les pipelines hors push et merge
# request (planifiés ou lancés à la main) les exécutent toujours en entier.
.unit_test_rules:
  rules:
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE !~ /^(push|merge_request_event)$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &unit_test_inputs
        - 'ansible/**/*'
        - 'tests/**/*'
        - 'scripts/**/*'
        - 'requirements-*.txt'
        - '.coveragerc'
        - '.gitlab-ci.yml'
        - 'Makefile'
        - 'ansible.cfg'
        - 'mypy.ini'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      changes: *unit_test_inputs

.alpine_test_tools:
  before_script:
    - apk add --no-cache bash zsh coreutils findutils grep file flock imagemagick git jq make lua5.4

# La suite Python est répartie en deux tranches (`parallel`) équilibrées d'après
# les durées du cache ; unit_tests_report vérifie que les tranches couvrent
# chaque test une fois et publie la couverture globale. Python 3.14 et le coeur
# sysmon de coverage allègent le traçage ; les tests lancés en sous-processus
# ne sont pas tracés (voir .coveragerc).
unit_tests:
  stage: test
  image: python:3.14-alpine
  parallel: 2
  rules: !reference [.unit_test_rules, rules]
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    COVERAGE_CORE: sysmon
    # Un fichier par tranche : unit_tests_report les fusionne.
    COVERAGE_FILE: .coverage.shard$CI_NODE_INDEX
  # The runner keeps these between jobs. The test durations let the runner
  # start the longest tests first; the key is shared by every branch. Shards
  # only read them so that all of them split the suite the same way;
  # unit_tests_report writes the new durations.
  cache:
    - key:
        files: [requirements-test.txt]
      paths: [.cache/pip/]
    - key:
        files: [ansible/requirements.yml]
      paths: [.ansible/collections/]
    - key: unit-test-durations
      paths: [.cache/unit-tests/]
      policy: pull
  before_script:
    - !reference [.alpine_test_tools, before_script]
    - python3 -m pip install -r requirements-test.txt
    # Some tests load roles that use pinned collection modules; without them
    # Ansible cannot resolve those tasks and the tests are skipped or fail.
    # Collections already restored from the cache are not downloaded again.
    - make galaxy
  script:
    # Longest tests first on every usable CPU; see the script docstring.
    - python3 scripts/ci/test_run_unit_tests.py
    - >-
      scripts/ci/run_unit_tests.py --coverage
      --shard "$CI_NODE_INDEX/$CI_NODE_TOTAL"
      --report "test-report-$CI_NODE_INDEX.json"
  artifacts:
    when: always
    paths:
      - .coverage.shard*
      - test-report-*.json
    expire_in: 1 day

unit_tests_report:
  stage: validate
  image: python:3.14-alpine
  needs: [unit_tests]
  rules: !reference [.unit_test_rules, rules]
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    - key:
        files: [requirements-test.txt]
      paths: [.cache/pip/]
    - key: unit-test-durations
      paths: [.cache/unit-tests/]
  before_script:
    - python3 -m pip install "$(grep '^coverage==' requirements-test.txt)"
  script:
    - scripts/ci/run_unit_tests.py --combine test-report-*.json
    - python3 -m coverage combine .coverage.shard*
    - python3 -m coverage report
    - python3 -m coverage xml -o coverage.xml
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?)%$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Les tests shell n'ont pas besoin de pip ni d'Ansible : ils tournent en même
# temps que la suite Python au lieu de la suivre.
shell_tests:
  stage: test
  image: python:3.13-alpine
  rules: !reference [.unit_test_rules, rules]
  before_script:
    - !reference [.alpine_test_tools, before_script]
  script:
    - bash tests/awww-monitor-scale.sh
    - bash tests/hyprlock-playerctlock.sh
    - bash tests/claude-statusline.sh
    - bash tests/hypr-keybinds.sh
    - bash tests/hypr-screenshot.sh
    - bash tests/hypr-record.sh
    - bash tests/vault-toggle.sh
    - zsh tests/arch-clean-no-orphans.zsh
    - zsh tests/git-pull-recursive.zsh
    - zsh tests/zsh-completion.zsh

ansible_lint:
  stage: validate
  image: python:3.13-slim
  before_script:
    - >-
      apt-get update && apt-get install -y --no-install-recommends make
      && rm -rf /var/lib/apt/lists/*
    - python -m pip install --no-cache-dir -r requirements-ansible.txt
    - export ANSIBLE_CONFIG="$CI_PROJECT_DIR/ansible.cfg"
    - make galaxy
  script:
    - make lint-ansible

.package_config:
  stage: package
  script:
    - tar -czf "$PACKAGE_ARCHIVE" -C ansible/roles/dotfiles/files/home $PACKAGE_PATHS
  artifacts:
    paths:
      - '$PACKAGE_ARCHIVE'

# Les archives Vim et Neovim sont maintenues sur la branche par défaut pour
# alimenter leurs URLs publiques ; ailleurs, elles ne sont construites que si
# leur configuration change.
package_vim:
  extends: .package_config
  image: python:3.13-alpine
  variables:
    PACKAGE_ARCHIVE: vim.tar.gz
  before_script:
    - apk add --no-cache git tar
    - python3 -m pip install --no-cache-dir PyYAML==6.0.3
  # Les plugins épinglés dans le rôle dotfiles, sans leur dossier .git.
  script:
    - mkdir package
    - cp -a ansible/roles/dotfiles/files/home/.vim ansible/roles/dotfiles/files/home/.vimrc package/
    - python3 scripts/ci/fetch_vim_plugins.py package
    - tar -czf "$PACKAGE_ARCHIVE" -C package .vim .vimrc
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &package_vim_changes
        - 'ansible/roles/dotfiles/files/home/.vim/**/*'
        - 'ansible/roles/dotfiles/files/home/.vimrc'
        - 'ansible/roles/dotfiles/defaults/main.yml'
        - 'scripts/ci/fetch_vim_plugins.py'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      changes: *package_vim_changes

package_nvim:
  extends: .package_config
  variables:
    PACKAGE_ARCHIVE: nvim.tar.gz
    PACKAGE_PATHS: .config/nvim
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - 'ansible/roles/dotfiles/files/home/.config/nvim/**/*'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      changes:
        - 'ansible/roles/dotfiles/files/home/.config/nvim/**/*'

.pages_build:
  stage: pages
  image: alpine:latest
  script:
    - apk add --no-cache python3 py3-markdown py3-pygments
    - sh scripts/ci/build_pages.sh
  artifacts:
    paths:
      - public

# Job Pages : Génère et déploie la documentation sur main et les tags de release
pages:
  extends: .pages_build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        # Tous les Markdown sont publiés (voir scripts/ci/gen_pages.py).
        - '**/*.md'
        # Les images liées sont aussi copiées dans le site (asset_extensions de scripts/ci/pages.json).
        - '**/*.gif'
        - '**/*.jpeg'
        - '**/*.jpg'
        - '**/*.png'
        - '**/*.svg'
        - '**/*.webp'
        - 'scripts/ci/style.css'
        - 'scripts/ci/favicon.ico'
        - 'scripts/ci/favicon.png'
        - 'scripts/ci/apple-touch-icon.png'
        - 'scripts/ci/gen_pages.py'
        - 'scripts/ci/pages.json'
        - 'scripts/ci/build_pages.sh'
        - '.gitlab-ci.yml'

# Job de validation Pages : construct les docs sur les branches non-déployées
build_pages_review:
  extends: .pages_build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        # Tous les Markdown sont publiés (voir scripts/ci/gen_pages.py).
        - '**/*.md'
        # Les images liées sont aussi copiées dans le site (asset_extensions de scripts/ci/pages.json).
        - '**/*.gif'
        - '**/*.jpeg'
        - '**/*.jpg'
        - '**/*.png'
        - '**/*.svg'
        - '**/*.webp'
        - 'scripts/ci/style.css'
        - 'scripts/ci/favicon.ico'
        - 'scripts/ci/favicon.png'
        - 'scripts/ci/apple-touch-icon.png'
        - 'scripts/ci/gen_pages.py'
        - 'scripts/ci/pages.json'
        - 'scripts/ci/build_pages.sh'
  artifacts:
    paths:
      - public
    expire_in: 1 week

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - sh scripts/ci/extract_release_notes.sh "$CI_COMMIT_TAG" > release_notes.txt
    - release-cli create --name "$CI_COMMIT_TAG" --description "$(cat release_notes.txt)"
