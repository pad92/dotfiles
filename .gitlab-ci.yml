---
# GitLab CI reference: https://docs.gitlab.com/ee/ci/

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml

default:
  tags:
    - chataigne

# A new commit on a branch cancels the interruptible jobs (tests and lint) of
# the branch's previous pipeline, so they stop competing for the runner's CPUs.
# Package, Pages and release jobs always run to the end.
workflow:
  auto_cancel:
    on_new_commit: interruptible

stages:
  - test
  - validate
  - package
  - pages
  - release

# The tests read only code, roles, scripts and their tooling, so a change to
# documentation or static files alone does not rerun them. The default branch,
# tags, and pipelines not started by a push or a merge request (scheduled or
# manual ones) always run all of them.
.unit_test_rules:
  rules:
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE !~ /^(push|merge_request_event)$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &unit_test_inputs
        - 'ansible/**/*'
        - 'tests/**/*'
        - 'scripts/**/*'
        - 'requirements-*.txt'
        - '.coveragerc'
        - '.gitlab-ci.yml'
        - '.gitmodules'
        - 'Makefile'
        - 'ansible.cfg'
        - 'mypy.ini'
    # A branch with an open merge request already gets a merge request pipeline.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null'
      changes: *unit_test_inputs

.alpine_test_tools:
  before_script:
    - apk add --no-cache bash zsh coreutils findutils grep file flock imagemagick git jq make lua5.4 tar

# Python 3.14 and coverage's sysmon core make tracing cheaper. Tests run in a
# subprocess are not traced (see .coveragerc). Splitting the suite into two
# jobs was tried: they fought over the same runner's CPUs and took longer than
# the single job.
unit_tests:
  stage: test
  interruptible: true
  image: python:3.14-alpine
  rules: !reference [.unit_test_rules, rules]
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    COVERAGE_CORE: sysmon
  # The runner keeps these between jobs. The test durations let the runner
  # start the longest tests first; the key is shared by every branch.
  cache:
    - key:
        files: [requirements-test.txt]
      paths: [.cache/pip/]
    - key:
        files: [ansible/requirements.yml]
      paths: [.ansible/collections/]
    - key: unit-test-durations
      paths: [.cache/unit-tests/]
      when: always
  before_script:
    - !reference [.alpine_test_tools, before_script]
    - python3 -m pip install -r requirements-test.txt
    # Some tests load roles that use pinned collection modules; without them
    # Ansible cannot resolve those tasks and the tests are skipped or fail.
    # Collections already restored from the cache are not downloaded again.
    - make galaxy
  script:
    # Longest tests first on every usable CPU; see the script docstring.
    - python3 scripts/ci/test_run_unit_tests.py
    - scripts/ci/run_unit_tests.py --coverage
    - python3 -m coverage report
    - python3 -m coverage xml -o coverage.xml
  coverage: '/^TOTAL.+?(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# The shell tests need only ansible-vault, so they run alongside the Python
# suite instead of after it.
shell_tests:
  stage: test
  interruptible: true
  image: python:3.14-alpine
  rules: !reference [.unit_test_rules, rules]
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  # Same interpreter and requirements as unit_tests; this job only reads the
  # cache, so the two concurrent jobs never overwrite each other's archive.
  cache:
    - key:
        files: [requirements-test.txt]
      paths: [.cache/pip/]
      policy: pull
  before_script:
    - !reference [.alpine_test_tools, before_script]
    - python3 -m pip install -r requirements-test.txt
  # The Makefile holds the list, so a new test runs here and locally alike.
  script:
    - make test-shell

ansible_lint:
  stage: validate
  interruptible: true
  image: python:3.13-slim
  before_script:
    - >-
      apt-get update && apt-get install -y --no-install-recommends make
      && rm -rf /var/lib/apt/lists/*
    - python -m pip install --no-cache-dir -r requirements-ansible.txt
    - export ANSIBLE_CONFIG="$CI_PROJECT_DIR/ansible.cfg"
    - make galaxy
  script:
    - make lint-ansible

.package_config:
  stage: package
  script:
    - tar -czf "$PACKAGE_ARCHIVE" -C ansible/roles/dotfiles/files/home $PACKAGE_PATHS
  artifacts:
    paths:
      - '$PACKAGE_ARCHIVE'

# The default branch always rebuilds the Vim, Zsh and Neovim archives behind
# their public URLs; other branches build them only when their configuration
# changes.
package_vim:
  extends: .package_config
  image: python:3.13-alpine
  variables:
    PACKAGE_ARCHIVE: vim.tar.gz
  before_script:
    - apk add --no-cache git tar
    - python3 -m pip install --no-cache-dir PyYAML==6.0.3
  # The plugins pinned in the dotfiles role, without their .git directories.
  script:
    - sh scripts/ci/package_vim.sh "$PACKAGE_ARCHIVE"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &package_vim_changes
        - 'ansible/roles/dotfiles/files/home/.vim/**/*'
        - 'ansible/roles/dotfiles/files/home/.vimrc'
        - 'ansible/roles/dotfiles/defaults/main.yml'
        - 'scripts/ci/fetch_vim_plugins.py'
        - 'scripts/ci/package_vim.sh'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      changes: *package_vim_changes

package_zsh:
  extends: .package_config
  image: python:3.13-alpine
  variables:
    PACKAGE_ARCHIVE: zsh.tar.gz
  before_script:
    - apk add --no-cache git tar
    - python3 -m pip install --no-cache-dir PyYAML==6.0.3
  # The Zsh tree, .zshrc rendered without Jinja, and the plugins pinned in the
  # dotfiles role, without their .git directories.
  script:
    - sh scripts/ci/package_zsh.sh "$PACKAGE_ARCHIVE"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &package_zsh_changes
        - 'ansible/roles/dotfiles/files/home/zsh/**/*'
        - 'ansible/roles/dotfiles/files/home/.zshenv'
        - 'ansible/roles/dotfiles/templates/home/.zshrc.j2'
        - 'ansible/roles/dotfiles/defaults/main.yml'
        - 'scripts/ci/build_zsh_package.py'
        - 'scripts/ci/fetch_vim_plugins.py'
        - 'scripts/ci/package_zsh.sh'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      changes: *package_zsh_changes

package_nvim:
  extends: .package_config
  variables:
    PACKAGE_ARCHIVE: nvim.tar.gz
    PACKAGE_PATHS: .config/nvim
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - 'ansible/roles/dotfiles/files/home/.config/nvim/**/*'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      changes:
        - 'ansible/roles/dotfiles/files/home/.config/nvim/**/*'

.pages_build:
  stage: pages
  image: python:3.14-alpine
  script:
    # Same versions as the local Arch packages (see the file).
    - pip install --quiet --disable-pip-version-check --root-user-action=ignore -r scripts/ci/pages-requirements.txt
    - sh scripts/ci/build_pages.sh
  artifacts:
    paths:
      - public

# Builds and deploys the documentation on main and on release tags.
pages:
  extends: .pages_build
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        # Every Markdown file is published (see scripts/ci/gen_pages.py).
        - '**/*.md'
        # Linked images are copied into the site too (asset_extensions in scripts/ci/pages.json).
        - '**/*.gif'
        - '**/*.jpeg'
        - '**/*.jpg'
        - '**/*.png'
        - '**/*.svg'
        - '**/*.webp'
        - 'scripts/ci/style.css'
        - 'scripts/ci/favicon.ico'
        - 'scripts/ci/favicon.png'
        - 'scripts/ci/apple-touch-icon.png'
        - 'scripts/ci/gen_pages.py'
        - 'scripts/ci/pages.json'
        - 'scripts/ci/build_pages.sh'
        - 'scripts/ci/pages-requirements.txt'
        - '.gitlab-ci.yml'

# Builds the documentation on branches that do not deploy it, as a check.
build_pages_review:
  extends: .pages_build
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    # Every Markdown file is published (see scripts/ci/gen_pages.py).
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes: &pages_review_inputs
        - '**/*.md'
        # Linked images are copied into the site too (asset_extensions in scripts/ci/pages.json).
        - '**/*.gif'
        - '**/*.jpeg'
        - '**/*.jpg'
        - '**/*.png'
        - '**/*.svg'
        - '**/*.webp'
        - 'scripts/ci/style.css'
        - 'scripts/ci/favicon.ico'
        - 'scripts/ci/favicon.png'
        - 'scripts/ci/apple-touch-icon.png'
        - 'scripts/ci/gen_pages.py'
        - 'scripts/ci/pages.json'
        - 'scripts/ci/build_pages.sh'
        - 'scripts/ci/pages-requirements.txt'
        - 'scripts/ci/test_gen_pages.py'
        # The generator tests check style.css against this palette.
        - 'ansible/roles/dotfiles/templates/home/.config/hypr/hyprtoolkit.conf.j2'
  artifacts:
    paths:
      - public
    expire_in: 1 week

# The page generator tests have their own job because they need git. The Pages
# jobs have no git, so they keep finding Markdown files by walking the tree.
pages_tests:
  stage: test
  image: python:3.14-alpine
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - changes: *pages_review_inputs
  script:
    - apk add --no-cache git
    - pip install --quiet --disable-pip-version-check --root-user-action=ignore -r scripts/ci/pages-requirements.txt
    - python3 scripts/ci/test_gen_pages.py

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - sh scripts/ci/extract_release_notes.sh "$CI_COMMIT_TAG" > release_notes.txt
    - release-cli create --name "$CI_COMMIT_TAG" --description "$(cat release_notes.txt)"
