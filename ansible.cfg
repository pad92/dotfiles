[defaults]
inventory = ansible/inventory.yml
roles_path = ansible/roles:.ansible/roles:~/.ansible/roles:/usr/share/ansible/roles
collections_path = .ansible/collections:/usr/share/ansible/collections
filter_plugins = ansible/filter_plugins
library = ansible/library
module_utils = ansible/module_utils
interpreter_python = auto_silent
remote_tmp = ~/.ansible/tmp
local_tmp = ~/.ansible/tmp
nocows = true
forks = 10
#display_ok_hosts = false
display_skipped_hosts = false

[sudo_become_plugin]
# pam_systemd (systemd 258+) writes OSC 3008 escape sequences to the TTY when
# sudo opens and closes its session. Ansible runs become tasks over ssh -tt,
# so the closing sequence lands after the module JSON and every become task
# warns "Module invocation had junk after the JSON data". pam_systemd skips
# these sequences when TERM is dumb.
executable = env TERM=dumb sudo

[diff]
always = true
context = 3
