general {
    lock_cmd = pgrep -u "$(id -u)" -x hyprlock >/dev/null || hyprlock --no-fade-in -c ~/.config/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    inhibit_sleep = 3
}
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend after 1h of inactivity — PadsTower only (hypridle has no
# per-host mechanism, so the command guards on the hostname via is-host.sh,
# shared with any future host-conditional listener).
# True hibernation is unavailable there (zram-only swap, no resume= param).
listener {
    timeout = 3600
    on-timeout = ~/.config/hypr/is-host.sh PadsTower && systemctl suspend
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
