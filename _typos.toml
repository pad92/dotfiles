# typos configuration — https://github.com/crate-ci/typos
# Allow French words used in code comments (e.g. .gitlab-ci.yml) that typos
# otherwise mistakes for English typos.
[default.extend-words]
sur = "sur"
branche = "branche"
formater = "formater"
hda = "hda"
Mattern = "Mattern"
pacin = "pacin"
facter = "facter"
Vertica = "Vertica"
kend = "kend"
parem = "parem"
Monstre = "Monstre"
Effet = "Effet"
wronly = "wronly"

[default.extend-identifiers]
PNGs = "PNGs"
