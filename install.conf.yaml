- defaults:
    link:
      relink: true
      backup: true

- link:
    ~/.tmux.conf: .tmux.conf
    ~/.tmux: .tmux
    ~/.vim: .vim
    ~/.vimrc: .vimrc
    ~/.zshenv: .zshenv
    ~/.zshrc: .zshrc
    ~/.gitconfig: .gitconfig
    ~/.gtkrc-2.0: .gtkrc-2.0
    ~/.config/autostart/nm-applet.desktop:
      path: .config/autostart/nm-applet.desktop
      create: true
    ~/.config/:
      glob: true
      path: .config/*
      exclude:
        - .config/autostart
      create: true

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - ["ln -sf config.$(hostname) ~/.config/waybar/config", Setting up Waybar host config]
