- defaults:
    link:
      relink: true
      backup: true

- link:
    ~/.tmux.conf: .tmux.conf
    ~/.tmux: .tmux
    ~/.vim: .vim
    ~/.vimrc: .vimrc
    ~/.zshenv: .zshenv
    ~/.zprofile: .zprofile
    ~/.zshrc: .zshrc
    ~/.gitconfig: .gitconfig
    ~/.gtkrc-2.0: .gtkrc-2.0
    ~/.config/autostart/nm-applet.desktop:
      path: .config/autostart/nm-applet.desktop
      create: true
    ~/.config/:
      glob: true
      path: .config/*
      exclude:
        - .config/autostart
        - .config/lact
      create: true

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - ["ln -sf config.$(hostname) ~/.config/waybar/config", Setting up Waybar host config]
    - ["if ! cmp -s .config/lact/config.yaml /etc/lact/config.yaml; then sudo install -d /etc/lact && if [ -e /etc/lact/config.yaml ]; then sudo cp -an /etc/lact/config.yaml /etc/lact/config.yaml.dotfiles-backup; fi && sudo install -m 644 .config/lact/config.yaml /etc/lact/config.yaml; fi", Installing LACT configuration]
