# mypy configuration for the repository's Python scripts.
[mypy]

# markdown and Pygments ship no py.typed marker, and their stub packages
# (types-Markdown, types-Pygments) are not packaged for Arch Linux. Let mypy
# read the installed sources instead of reporting import-untyped.
[mypy-markdown.*]
follow_untyped_imports = True

[mypy-pygments.*]
follow_untyped_imports = True
