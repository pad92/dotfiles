---
# The playbooks already ran selection.yml; this covers the role used alone.
- name: Select requested package groups
  ansible.builtin.include_tasks:
    file: selection.yml
    apply:
      tags: [always]
  when: packages_selected_groups is not defined
  tags: [always]

- name: Plan selected packages
  ansible.builtin.import_tasks: install.yml
  tags: [packages_install, packages_reconcile]

# The plan action is read-only for the whole playbook.
- name: Stop after the package plan
  ansible.builtin.meta: end_play
  when: packages_action == 'plan'
  tags: [packages_install, packages_reconcile, yay]

# Check mode cannot simulate package installation, so it skips package changes
# and continues with the other roles.
- name: Install selected packages
  ansible.builtin.import_tasks: apply.yml
  when: not ansible_check_mode
  tags: [packages_install, packages_reconcile]

- name: Reconcile managed packages
  ansible.builtin.import_tasks: reconcile.yml
  when: not ansible_check_mode
  tags: [packages_reconcile]
