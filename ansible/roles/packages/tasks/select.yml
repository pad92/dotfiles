---
- name: Validate package action
  ansible.builtin.assert:
    that:
      - packages_action in ['install', 'plan', 'reconcile']
      - packages_aur_action in ['ask', 'install', 'skip']
    fail_msg: >-
      packages_action or packages_aur_action has an unsupported value.

- name: Build package state path
  ansible.builtin.set_fact:
    packages_state_path: >-
      {{ packages_state_directory }}/{{ packages_state_filename }}

- name: Inspect saved package state
  ansible.builtin.stat:
    path: '{{ packages_state_path }}'
  register: packages_state_stat

- name: Read saved package state
  ansible.builtin.slurp:
    src: '{{ packages_state_path }}'
  register: packages_state_file
  when: packages_state_stat.stat.exists

- name: Validate saved package state
  ansible.builtin.set_fact:
    packages_state_data: >-
      {{ packages_state_file.content | b64decode | parse_package_state_json }}
  when: packages_state_stat.stat.exists

- name: Initialize package state defaults
  ansible.builtin.set_fact:
    packages_state_data: '{{ packages_state_data | default(none) }}'
    packages_state_valid:
      '{{ packages_state_data is defined and packages_state_data
      is not none }}'
    packages_previous_owned: >-
      {{ packages_state_data.owned_packages
         if packages_state_data is defined and packages_state_data is not none
         else [] }}

- name: Warn when package state is invalid
  ansible.builtin.debug:
    msg: 'Package state is invalid; automatic removals are disabled.'
  when: packages_state_stat.stat.exists and not packages_state_valid

- name: Build available package groups
  ansible.builtin.set_fact:
    packages_available_groups: >-
      {{ packages_family_groups[ansible_facts['os_family']].keys() | list }}

- name: Require package group definitions
  ansible.builtin.assert:
    that:
      - packages_available_groups | length > 0
    fail_msg: "No package groups are defined for {{ ansible_facts['distribution'] }}."

- name: Read graphics controllers when lspci is available
  ansible.builtin.command:
    argv:
      - lspci
      - -Dnn
  register: packages_lspci
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Classify graphics groups
  ansible.builtin.set_fact:
    packages_detected_graphics_groups:
      '{{ packages_lspci.stdout | detect_graphics_groups
      }}'
    packages_graphics_controllers_found: '{{ packages_lspci.stdout |
      graphics_controllers_found }}'
    packages_graphics_detection_available: true
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_lspci.rc | default(1) == 0

# Lookups would read the controller's sysfs: the target's is read over SSH.
- name: Read PCI controller identifiers from sysfs when lspci is unavailable
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - >-
        for device in /sys/bus/pci/devices/*; do
        [ -r "$device/class" ] || continue;
        printf '%s %s %s\n' "$(cat "$device/class")"
        "$(cat "$device/vendor")" "$(cat "$device/device")"; done
  register: packages_pci_sysfs_listing
  changed_when: false
  check_mode: false
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_lspci.rc | default(1) != 0

- name: Collect PCI controller identifiers from sysfs
  ansible.builtin.set_fact:
    packages_pci_sysfs_devices: >-
      {{ packages_pci_sysfs_devices | default([]) + [{
         'class': item.split()[0],
         'vendor': item.split()[1],
         'device': item.split()[2] }] }}
  loop: '{{ packages_pci_sysfs_listing.stdout_lines | default([]) }}'
  when: ansible_facts['os_family'] == 'Archlinux'

- name: Record graphics detection from sysfs
  ansible.builtin.set_fact:
    packages_graphics_controllers_found: '{{ packages_pci_sysfs_devices |
      default([]) | graphics_controllers_found }}'
    packages_graphics_detection_available: >-
      {{ packages_pci_sysfs_devices | default([]) | length > 0 }}
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_lspci.rc | default(1) != 0

- name: Classify AMD graphics from sysfs when lspci is unavailable
  ansible.builtin.set_fact:
    packages_detected_graphics_groups: >-
      {{ packages_pci_sysfs_devices | default([])
         | detect_sysfs_graphics_groups }}
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_lspci.rc | default(1) != 0

- name: Validate automatic graphics detection on Arch Linux
  ansible.builtin.assert:
    that:
      - (packages_group_selection is defined and
        packages_group_selection is not none) or
        ((packages_graphics_detection_available | default(false) | bool) and
        (packages_detected_graphics_groups | default([]) | length > 0 or
        not (packages_graphics_controllers_found | default(false) | bool)))
    fail_msg: >-
      Unable to classify every graphics controller automatically. Ensure
      pciutils and its PCI ID database are available and current, or set
      packages_group_selection explicitly to choose the required drivers.
  when:
    - ansible_facts['os_family'] == 'Archlinux'

- name: Build default package group selection
  ansible.builtin.set_fact:
    packages_group_defaults: >-
      {{ (packages_default_groups
          + (packages_detected_graphics_groups | default([])))
         | unique | sort }}

- name: Validate the host package groups
  ansible.builtin.assert:
    quiet: true
    that: >-
      packages_host_groups is none or
      (packages_host_groups is sequence and packages_host_groups is not string
       and packages_host_groups is not mapping)
    fail_msg: >-
      packages_host_groups takes a list of package groups. Set it for this
      machine in ansible/host_vars/<hostname>.yml.

- name: Apply package group selection
  ansible.builtin.set_fact:
    packages_selected_groups: >-
      {{ packages_group_selection | default(none)
         | select_package_groups(packages_host_groups, packages_group_defaults,
                                packages_detected_graphics_groups | default([])) }}

- name: Validate selected package groups
  ansible.builtin.assert:
    that:
      - packages_selected_groups is sequence
      - packages_selected_groups is not string
      - packages_selected_groups | difference(packages_available_groups) |
        length == 0
    fail_msg: >-
      Unsupported package groups: {{
      packages_selected_groups | difference(packages_available_groups) | join(', ')
      }}

- name: Load selected package group contents
  ansible.builtin.set_fact:
    packages_group_contents: >-
      {{ packages_group_contents | default({}) | combine({
         item: packages_family_groups[ansible_facts['os_family']][item] }) }}
  loop: '{{ packages_selected_groups }}'

- name: Build desired package list
  ansible.builtin.set_fact:
    packages_desired: >-
      {{ packages_group_contents | default({}) | dict2items
         | map(attribute='value') | flatten | unique | sort }}

# DKMS modules (NVIDIA, v4l2loopback) build only against installed headers of
# the running kernel, which pacman reports as the owner of its vmlinuz.
- name: Find the package that owns the running Arch kernel
  ansible.builtin.command:
    argv:
      - pacman
      - -Qqo
      - "/usr/lib/modules/{{ ansible_facts['kernel'] }}/vmlinuz"
  register: packages_kernel_owner
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_desired | select('match', '.*-dkms$') | list | length > 0

- name: Warn when the running kernel has no package owner
  ansible.builtin.debug:
    msg: >-
      DKMS packages are selected but no package owns the running kernel
      {{ ansible_facts['kernel'] }}; install its headers manually.
  when:
    - packages_kernel_owner.rc | default(0) != 0

- name: Add the running kernel headers for DKMS packages
  ansible.builtin.set_fact:
    packages_desired: >-
      {{ (packages_desired + (packages_desired | dkms_kernel_headers(
          packages_kernel_owner.stdout | default('') | trim)))
         | unique | sort }}
  when:
    - packages_kernel_owner.rc | default(1) == 0
