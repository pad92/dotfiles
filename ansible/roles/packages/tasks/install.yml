---
- name: Read installed package inventory
  ansible.builtin.package_facts:
    manager: auto
  when: packages_selected_groups | length > 0
  tags: [yay]

- name: Validate installed package inventory
  ansible.builtin.assert:
    that:
      - ansible_facts.packages is defined
      - ansible_facts.packages | length > 0
    fail_msg: 'Unable to read a valid package inventory; package state is unchanged.'
  when: packages_selected_groups | length > 0
  tags: [yay]

- name: Snapshot installed packages
  ansible.builtin.set_fact:
    packages_installed_before: '{{ ansible_facts.packages.keys() | list }}'
    packages_facts_before: '{{ ansible_facts.packages }}'
  when: packages_selected_groups | length > 0
  tags: [yay]

# pacman -T resolves provides, so foo-git satisfies a request for foo.
- name: Find desired packages unsatisfied on Arch Linux
  ansible.builtin.command:
    argv: "{{ ['pacman', '-T', '--'] + packages_desired }}"
  register: packages_arch_unsatisfied
  changed_when: false
  failed_when: packages_arch_unsatisfied.rc not in [0, 127]
  check_mode: false
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_selected_groups | length > 0
    - packages_desired | length > 0
  tags: [yay]

- name: Find missing desired packages
  ansible.builtin.set_fact:
    packages_missing: >-
      {{ (packages_arch_unsatisfied.stdout_lines | default([])
          if ansible_facts['os_family'] == 'Archlinux'
          else packages_desired | difference(packages_installed_before))
         | sort }}
  when: packages_selected_groups | length > 0
  tags: [yay]

- name: List packages available in configured Arch repositories
  ansible.builtin.command:
    argv: [pacman, -Sl]
  register: packages_arch_repository_listing
  changed_when: false
  check_mode: false
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_missing | default([]) | length > 0
  tags: [yay]

- name: Extract available Arch repository package names
  ansible.builtin.set_fact:
    packages_arch_repository_names: >-
      {{ packages_arch_repository_listing.stdout |
         regex_findall('(?m)^\S+\s+(\S+)\s') }}
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_missing | default([]) | length > 0
  tags: [yay]

- name: Split Arch packages by repository source
  ansible.builtin.set_fact:
    packages_arch_repository: >-
      {{ packages_missing | intersect(packages_arch_repository_names) | sort }}
    packages_arch_aur: >-
      {{ packages_missing | difference(packages_arch_repository_names)
         | reject('match', '^lib32-') | reject('equalto', 'steam') | sort }}
    packages_arch_missing_multilib: >-
      {{ packages_missing | difference(packages_arch_repository_names)
         | select('match', '^(lib32-|steam$)') | sort }}
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_selected_groups | length > 0
    - packages_missing | default([]) | length > 0
  tags: [yay]

- name: Require CachyOS gaming packages in configured repositories
  ansible.builtin.assert:
    that:
      - >-
        packages_arch_aur | default([])
        | intersect(packages_cachyos_repository_packages | default([])) | length == 0
    fail_msg: >-
      CachyOS packages required by 21_steam are missing from configured
      repositories. Check the CachyOS repository configuration and package databases.
  when: ansible_facts['distribution'] == 'CachyOS'
  tags: [yay]

- name: Refuse packages requiring disabled multilib
  ansible.builtin.assert:
    that:
      - packages_arch_missing_multilib | default([]) | length == 0
    fail_msg: >-
      Packages require the multilib repository: {{
      packages_arch_missing_multilib | default([]) | join(', ') }}. The standard [multilib]
      block could not be enabled in /etc/pacman.conf. Enable it manually, run
      pacman -Syu, and rerun the installer.
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_selected_groups | length > 0
    - not ansible_check_mode
    - packages_action != 'plan'
  tags: [yay]

- name: Calculate removal candidates for a read-only plan
  ansible.builtin.set_fact:
    packages_plan_graphics_removals: >-
      {{ (packages_family_groups[ansible_facts['os_family']] | unneeded_graphics_packages(
          packages_selected_groups, packages_installed_before, packages_desired))
         | intersect(packages_previous_owned) | sort }}
    packages_plan_removals: >-
      {{ packages_installed_before | package_removal_candidates(
          packages_desired, packages_previous_owned, packages_protected)
         | difference(packages_plan_graphics_removals | default([])) | sort }}
  when:
    - packages_state_valid
    - packages_action in ['plan', 'reconcile']
    - packages_selected_groups | length > 0

- name: Show package plan
  ansible.builtin.debug:
    msg:
      selected_groups: '{{ packages_selected_groups }}'
      packages_to_install: >-
        {{ (packages_arch_repository | default(packages_missing | default([])))
           + (packages_arch_aur | default([])) }}
      managed_removal_candidates: '{{ packages_plan_removals | default([]) }}'
      graphics_removal_candidates:
        '{{ packages_plan_graphics_removals | default([])
        }}'
      packages_requiring_multilib: '{{ packages_arch_missing_multilib | default([]) }}'
      saved_state_valid: '{{ packages_state_valid }}'
  when: ansible_check_mode or packages_action == 'plan'
  tags: [yay]
