---
# Groups of this host, set in ansible/group_vars/host_<hostname>.yml. The
# list replaces the OS and GPU defaults; null keeps the defaults.
packages_host_groups: null
packages_state_directory:
  "{{ lookup('env', 'XDG_STATE_HOME') | default(lookup('env',
  'HOME') + '/.local/state', true) }}/dotfiles"
packages_action: install
# Partial profiles (ansible/obs.yml) add their groups to the saved selection
# instead of replacing it with their narrower list.
packages_state_merge_selection: false
packages_upgrade_system: false
packages_aur_action: install
packages_aur_helper_preference: [yay]
packages_gaming_required_packages:
  - ananicy-cpp
  - power-profiles-daemon
  - python-gobject
# Extra packages that removals must never touch. The base set (base, glibc,
# pacman, systemd, linux and linux-*, ...) is built into the dotfiles filters.
packages_protected: []
