---
- name: Select services for the selected package groups
  ansible.builtin.set_fact:
    package_services_selected: >-
      {{ package_services_by_group.get(ansible_facts['os_family'], {}) | dict2items
         | selectattr('key', 'in', packages_selected_groups)
         | map(attribute='value') | flatten | unique | sort }}

# A unit is enabled only once its package is installed, which also keeps check
# mode from failing before packages exist.
- name: Find unit files for the selected services
  ansible.builtin.stat:
    path: '{{ package_services_unit_directory }}/{{ item }}'
    get_checksum: false
  loop: '{{ package_services_selected }}'
  register: package_services_unit_stats

# A host without the device would only get a unit that fails or idles, such as
# bluetooth.service on a machine with no Bluetooth controller.
- name: Look for the devices that selected services need
  ansible.builtin.find:
    paths: '{{ package_services_device_requirements[item].path }}'
    patterns: '{{ package_services_device_requirements[item].patterns }}'
    file_type: any
  loop: >-
    {{ package_services_selected
       | select('in', package_services_device_requirements) | list }}
  register: package_services_device_searches

- name: Find services whose device or unit file is missing
  ansible.builtin.set_fact:
    package_services_without_device: >-
      {{ package_services_device_searches.results
         | selectattr('matched', 'defined') | selectattr('matched', '==', 0)
         | map(attribute='item') | list }}
    package_services_missing: >-
      {{ package_services_unit_stats.results | rejectattr('stat.exists')
         | map(attribute='item') | list }}

- name: Select installed service units whose device is present
  ansible.builtin.set_fact:
    package_services_to_enable: >-
      {{ package_services_unit_stats.results | selectattr('stat.exists')
         | map(attribute='item')
         | reject('in', package_services_without_device) | list }}

- name: Report services skipped because their device is absent
  ansible.builtin.debug:
    msg: >-
      Not enabled because no matching device was found:
      {{ package_services_without_device | join(', ') }}
  when: package_services_without_device | length > 0

- name: Report services whose package is not installed
  ansible.builtin.debug:
    msg: >-
      Not enabled because their unit file is missing:
      {{ package_services_missing | join(', ') }}
  when: package_services_missing | length > 0

# A boot-only unit is enabled without being started: see
# package_services_boot_only.
- name: Enable and start services for the selected packages
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
    state: "{{ omit if item in package_services_boot_only else 'started' }}"
  loop: '{{ package_services_to_enable }}'

- name: Validate the users who join package groups
  ansible.builtin.assert:
    that:
      - item | length > 0
      - item != 'root'
    fail_msg: package_services_group_users must list regular user names.
    quiet: true
  loop: '{{ package_services_group_users }}'

- name: Select the groups the users must leave
  ansible.builtin.set_fact:
    package_services_retired_memberships: []
    package_services_retired_groups: >-
      {{ package_services_retired_user_groups.get(ansible_facts['os_family'], [])
         | unique | sort }}

# A retired group is never joined: the users would join it, then leave it
# again in the same run, on every deploy.
- name: Select user groups for the selected package groups
  ansible.builtin.set_fact:
    package_services_user_groups: >-
      {{ package_services_user_groups_by_group.get(ansible_facts['os_family'], {})
         | dict2items | selectattr('key', 'in', packages_selected_groups)
         | map(attribute='value') | flatten
         | reject('in', package_services_retired_groups) | unique | sort }}

# A group exists only once the package that creates it is installed. Its
# members also tell which retired groups a user still belongs to.
- name: Read the system groups
  ansible.builtin.getent:
    database: group
  when: >-
    package_services_user_groups | length > 0
    or package_services_retired_groups | length > 0

- name: Find user groups that exist on the system
  ansible.builtin.set_fact:
    package_services_user_groups_present: >-
      {{ package_services_user_groups
         | select('in', ansible_facts.getent_group | default({})) | list }}
    package_services_user_groups_missing: >-
      {{ package_services_user_groups
         | reject('in', ansible_facts.getent_group | default({})) | list }}

- name: Report user groups whose package is not installed
  ansible.builtin.debug:
    msg: >-
      Not joined because the group does not exist:
      {{ package_services_user_groups_missing | join(', ') }}
  when: package_services_user_groups_missing | length > 0

- name: Add the regular users to the selected groups
  ansible.builtin.user:
    name: '{{ item }}'
    groups: '{{ package_services_user_groups_present }}'
    append: true
  loop: '{{ package_services_group_users }}'
  when: package_services_user_groups_present | length > 0
  notify: Report package group membership requires login

# getent lists a group as [password, gid, members], members comma-separated.
# The user module sets the supplementary groups only as a whole, so the users
# keep every group they are in except the retired ones, plus the groups the
# previous task added after the system groups were read.
- name: Find the users still in a retired group
  ansible.builtin.set_fact:
    package_services_retired_memberships: >-
      {{ package_services_retired_memberships
         + [{'user': item,
             'leave': member_of | select('in', package_services_retired_groups) | list,
             'keep': member_of | union(package_services_user_groups_present | default([]))
                     | reject('in', package_services_retired_groups) | sort}] }}
  vars:
    member_of: >-
      {{ ansible_facts.getent_group | default({}) | dict2items
         | selectattr('value.2', 'defined')
         | selectattr('value.2', 'search', '(^|,)' ~ (item | regex_escape) ~ '(,|$)')
         | map(attribute='key') | sort }}
  loop: '{{ package_services_group_users }}'
  when: member_of | select('in', package_services_retired_groups) | list | length > 0

- name: Remove the regular users from the retired groups
  ansible.builtin.user:
    name: '{{ item.user }}'
    groups: '{{ item.keep }}'
    append: false
  loop: '{{ package_services_retired_memberships }}'
  loop_control:
    label: '{{ item.user }} leaves {{ item.leave | join(", ") }}'
  notify: Report leaving a package group requires login

# pam_limits gives a user line priority over a group line, so this file caps
# the nice value of the users whatever groups they are in, such as `audio`,
# to which cachyos-settings gives a limit of -11. Without it, Chromium and
# Electron threads run at -8 with every process they start.
# pam owns no limits.d: a host where no package added one lacks the directory.
- name: Create the directory of the nice limit
  ansible.builtin.file:
    path: '{{ package_services_nice_limits_file | dirname }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Forbid negative nice values
  ansible.builtin.copy:
    dest: '{{ package_services_nice_limits_file }}'
    content: |
      # Managed by Ansible (package_services). A user line overrides the group
      # limits of limits.d: no process of these users goes below nice 0.
      {% for user in package_services_group_users %}
      {{ user }} - nice 0
      {% endfor %}
    owner: root
    group: root
    mode: '0644'
  notify: Report the nice limit requires login
