---
# Units enabled and started when their package group is selected, by OS family.
# Debian and Fedora packages usually enable their own services.
# fstrim.timer comes with util-linux; it trims mounted filesystems weekly and
# skips those that do not support discard. paccache.timer comes with
# pacman-contrib; it keeps the last three versions of each cached package.
# linux-modules-cleanup.service comes with kernel-modules-hook: a kernel upgrade
# keeps the running kernel's modules, so `modprobe loop` still works before the
# reboot. At the next boot the service moves that copy to /usr/lib/modules/.old,
# which systemd-tmpfiles empties after four weeks.
package_services_by_group:
  Archlinux:
    01_base:
      - bluetooth.service
      - fstrim.timer
      - linux-modules-cleanup.service
      - paccache.timer
    04_printers: [cups.socket]
    # Reads Caps Lock from libinput so SwayOSD shows the ON/OFF pop-up.
    11_hyprland: [swayosd-libinput-backend.service]
    12_containers_docker: [docker.socket]
    20_apps: [fwupd-refresh.timer]
# Units that only run at boot: they are enabled but not started. A oneshot unit
# such as linux-modules-cleanup.service is inactive once it has run, so
# `state: started` would run it again, and report a change, on every deploy.
package_services_boot_only:
  - linux-modules-cleanup.service
package_services_unit_directory: /usr/lib/systemd/system
# Units that need a hardware device: such a unit is enabled only when an entry
# matching `patterns` exists in `path`. The kernel lists each Bluetooth
# controller as /sys/class/bluetooth/hciN; the directory itself can exist with
# no controller once the bluetooth module is loaded.
package_services_device_requirements:
  bluetooth.service:
    path: /sys/class/bluetooth
    patterns: [hci*]
# System groups that a selected package group creates and that the regular
# users join, by OS family. openrazer-driver-dkms creates `plugdev`, which its
# udev rule gives the Razer device nodes; openrazer-daemon does not start for a
# user outside it. `realtime` (realtime-privileges) is left out on purpose: it
# lets every user process take a negative nice value, so Chromium and Electron
# threads run at -8 with the processes they start. rtkit gives PipeWire
# real-time scheduling instead.
package_services_user_groups_by_group:
  Archlinux:
    25_razer: [plugdev]
# Groups the regular users must leave, by OS family, whatever the selected
# package groups. An older deploy added them to `realtime`; staying in it keeps
# its negative nice limits even after the role stops adding new members.
package_services_retired_user_groups:
  Archlinux: [realtime]
# Caps the nice value of package_services_group_users at 0: a user line wins
# over the group limits that packages add to limits.d.
package_services_nice_limits_file: /etc/security/limits.d/90-no-negative-nice.conf
package_services_group_users:
  - "{{ ansible_facts['user_id'] }}"
