# Keep ALSA and Bluetooth nodes awake, to avoid the pop and the start-up
# latency of a suspended device. Deployed by the audio role when
# audio_disable_suspend is true.

monitor.alsa.rules = [
    {
        matches = [
            { node.name = "~alsa_output.*" }
            { node.name = "~alsa_input.*" }
        ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
            }
        }
    }
]

monitor.bluez.rules = [
    {
        matches = [
            { node.name = "~bluez_output.*" }
            { node.name = "~bluez_input.*" }
        ]
        actions = {
            update-props = {
                session.suspend-timeout-seconds = 0
            }
        }
    }
]
