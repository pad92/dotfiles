# Bluetooth configuration for WirePlumber 0.5+. Deployed by the audio role.

wireplumber.settings = {
    # Keep A2DP while an application records: switching to the headset
    # profile (HSP/HFP) drops the audio quality. The headset profile stays
    # available by hand, so a Bluetooth headset microphone still works.
    bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.properties = {
    bluez5.enable-sbc-xq    = true
    bluez5.enable-msbc      = true
    bluez5.enable-hw-volume = true
    # bluez5.codecs is left unset on purpose: a list there disables every
    # codec it omits, including the HFP codecs (cvsd, msbc, lc3_swb) that the
    # headset microphone needs. LDAC keeps its adaptive "auto" quality, which
    # lowers the bit rate instead of dropping out when the signal weakens.
}
