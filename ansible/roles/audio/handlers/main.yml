---
# Leaves stopped services alone; the job is queued without waiting.
- name: Apply changed user audio configuration
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - --no-block
      - try-reload-or-restart
      - pipewire.service
      - pipewire-pulse.service
      - wireplumber.service
  changed_when: true
  become: false
