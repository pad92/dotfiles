---
system_initramfs_generator: auto
system_initramfs_report_roots: [/boot, /efi]
system_ipv6_enabled_default: true
system_ipv6_enabled_by_hostname: {}
system_i915_enable_guc: null
system_i915_guc_supported: false
system_amd_pstate_epp: balance_performance
system_amd_x3d_mode: null
# Boot-time copy of the AMD CPU controls applied by Ansible.
system_amd_tmpfiles_path: /etc/tmpfiles.d/dotfiles-amd-cpu.conf
system_cpu_power_managers:
  - power-profiles-daemon.service
  - auto-cpufreq.service
  - tlp.service
  - tuned.service
  - tuned-ppd.service
  - cpupower.service
  - system76-power.service
# What to do when another CPU power manager would run alongside the gaming
# power-profiles-daemon: ask, remove (stop, disable, uninstall), or fail.
system_power_manager_conflict_action: ask
system_lact_config_path: /etc/lact/config.yaml
# Fan curves remain hardware defaults unless already customized in LACT.
system_lact_profiles:
  Auto:
    performance_level: auto
  Adaptive:
    performance_level: auto
  PreferMaximumPerformance:
    performance_level: high
system_lact_nvidia_profiles:
  Auto:
    power_mizer_mode: Auto
  Adaptive:
    power_mizer_mode: Adaptive
  PreferMaximumPerformance:
    power_mizer_mode: PreferMaximumPerformance
# Units enabled and started when their package group is selected, by OS family.
# Debian and Fedora packages usually enable their own services.
system_package_services:
  Archlinux:
    01_base: [bluetooth.service]
    04_printers: [cups.socket]
    12_containers_docker: [docker.socket]
    20_apps: [fwupd-refresh.timer]
system_unit_directory: /usr/lib/systemd/system
# Users added to the docker group with 12_containers_docker. Membership grants
# root-equivalent access to the Docker daemon.
system_docker_group_users:
  - "{{ lookup('env', 'USER') }}"
# Packages whose update requires ananicy-cpp to reload its rules.
system_ananicy_rule_packages: [cachyos-ananicy-rules]
