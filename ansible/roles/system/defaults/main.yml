---
system_initramfs_generator: auto
system_initramfs_report_roots: [/boot, /efi]
# Set it to false in group_vars/host_<hostname>.yml to disable IPv6.
system_ipv6_enabled: true
system_i915_enable_guc: null
system_i915_guc_supported: false
system_amd_pstate_epp: balance_performance
system_amd_x3d_mode: null
# Boot-time copy of the AMD CPU controls applied by Ansible.
system_amd_tmpfiles_path: /etc/tmpfiles.d/dotfiles-amd-cpu.conf
system_cpu_power_managers:
  - power-profiles-daemon.service
  - auto-cpufreq.service
  - tlp.service
  - tuned.service
  - tuned-ppd.service
  - cpupower.service
  - system76-power.service
# What to do when another CPU power manager would run alongside the gaming
# power-profiles-daemon: ask, remove (stop, disable, uninstall), or fail.
system_power_manager_conflict_action: ask
system_lact_config_path: /etc/lact/config.yaml
# Fan curves remain hardware defaults unless already customized in LACT.
system_lact_profiles:
  Auto:
    performance_level: auto
  Adaptive:
    performance_level: auto
  PreferMaximumPerformance:
    performance_level: high
system_lact_nvidia_profiles:
  Auto:
    power_mizer_mode: Auto
  Adaptive:
    power_mizer_mode: Adaptive
  PreferMaximumPerformance:
    power_mizer_mode: PreferMaximumPerformance
# Units enabled and started when their package group is selected, by OS family.
# Debian and Fedora packages usually enable their own services.
system_package_services:
  Archlinux:
    01_base: [bluetooth.service]
    04_printers: [cups.socket]
    12_containers_docker: [docker.socket]
    20_apps: [fwupd-refresh.timer]
system_unit_directory: /usr/lib/systemd/system
# Users added to the docker group with 12_containers_docker. Membership grants
# root-equivalent access to the Docker daemon.
system_docker_group_users:
  - "{{ lookup('env', 'USER') }}"
# Packages whose update requires ananicy-cpp to reload its rules.
system_ananicy_rule_packages: [cachyos-ananicy-rules]
# false leaves the resolver setup untouched, for example after undoing the
# migration; a full run otherwise applies the DNS policy again.
system_dns_manage: true
# DNS: systemd-resolved is the only resolver. Quote the values: YAML reads a
# bare no as a boolean. LLMNR stays off so single-label names never reach the
# local network; mDNS resolves .local names without announcing this host.
system_dns_llmnr: 'no'
system_dns_multicast_dns: resolve
# Used only when no link has DNS servers. Empty disables the compiled-in
# public resolvers instead of sending queries to them in clear text.
system_dns_fallback_servers: []
system_dns_resolved_dropin: /etc/systemd/resolved.conf.d/60-dotfiles-dns.conf
system_dns_networkmanager_conf: /etc/NetworkManager/conf.d/60-dotfiles-dns.conf
# Host address of docker0. With 12_containers_docker, Docker uses it as `bip`
# and containers query the resolved stub listening on it.
system_docker_bridge_ip: 10.184.1.1/28
system_docker_daemon_config_path: /etc/docker/daemon.json
# Files of the former dnsmasq relay. Finding one of them is what allows the
# role to reset loopback-only NetworkManager profiles and stop dnsmasq.service;
# without them, a loopback DNS server is treated as a deliberate local resolver.
system_dns_relay_files:
  - /etc/dnsmasq.d/home-failover.conf
  - /etc/NetworkManager/dispatcher.d/90-dnsmasq-upstream
  - /etc/tmpfiles.d/dnsmasq-upstream.conf
# NetworkManager settings left by the former relay and the former install
# guide (rc-manager=resolvconf for openresolv). They override dns= or rewrite
# /etc/resolv.conf. Each is removed when it sets nothing but dns= or
# rc-manager= in [main]; a file with other settings is reported and kept.
system_dns_legacy_files:
  - /etc/NetworkManager/conf.d/dns.conf
  - /etc/NetworkManager/conf.d/rc-manager.conf
# Relay files, legacy files and a regular /etc/resolv.conf are copied here
# under their full path (for example <dir>/etc/resolv.conf) before removal.
system_dns_backup_dir: /var/lib/dotfiles/dns-backup
system_dns_resolv_conf: /etc/resolv.conf
system_dns_resolved_stub: /run/systemd/resolve/stub-resolv.conf
# A regular resolv.conf is replaced by the stub link only when openresolv,
# NetworkManager or systemd-resolved wrote it, or when it lists only loopback
# servers. true also replaces a file another program owns, such as a VPN client.
system_dns_force_resolv_conf_link: false
# SAML VPN through openfortivpn. The gateway lives only in the Ansible Vault
# (ansible/group_vars/all/vault_vpn.yml, ignored by Git): without
# vault_vpn_gateway_host the vpn tasks change nothing.
system_vpn_gateway_host: "{{ vault_vpn_gateway_host | default('') }}"
system_vpn_gateway_port: "{{ vault_vpn_gateway_port | default(443) }}"
# Instance of openfortivpn@.service; the daemon reads <config dir>/<name>.conf.
system_vpn_name: work
# Local port where the browser hands the SAML session back to openfortivpn.
system_vpn_saml_port: 8020
# The SAML login waits for the browser and the MFA before the tunnel is ready.
system_vpn_start_timeout: 5min
system_vpn_config_dir: /etc/openfortivpn
system_vpn_unit_dropin_dir: /etc/systemd/system/openfortivpn@{{ system_vpn_name }}.service.d
system_vpn_polkit_rule: /etc/polkit-1/rules.d/60-dotfiles-vpn.rules
# The Waybar module reads the unit name and the login URL here.
system_vpn_waybar_config: /etc/openfortivpn/waybar.json
# Users of an active local session who may start and stop the VPN unit
# without a password. No other unit or verb is granted.
system_vpn_users:
  - "{{ lookup('env', 'USER') }}"
