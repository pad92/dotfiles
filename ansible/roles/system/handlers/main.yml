---
- name: Restart LACT
  ansible.builtin.systemd_service:
    name: lactd.service
    state: restarted

- name: Apply managed sysctl policy
  ansible.builtin.command:
    argv: [sysctl, -p, /etc/sysctl.d/hardening.conf]
  changed_when: not ansible_check_mode
  when: not ansible_check_mode

- name: Regenerate Arch initramfs
  ansible.builtin.command:
    argv: >-
      {{ ['mkinitcpio', '-P']
         if system_initramfs_generator_effective == 'mkinitcpio'
         else ['dracut', '--regenerate-all', '--force'] }}
  changed_when: not ansible_check_mode
  when: not ansible_check_mode
