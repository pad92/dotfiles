---
# Sysfs writes are lost at reboot. Persist only the controls that Ansible
# configured in this run, so a power manager keeps ownership of EPP.
- name: Decide which AMD CPU controls to persist
  ansible.builtin.set_fact:
    system_amd_persist_epp: >-
      {{ system_amd_pstate_epp is not none and
         system_amd_epp_files.files | default([]) | length > 0 }}
    system_amd_persist_x3d: >-
      {{ system_amd_x3d_mode is not none and
         system_amd_x3d_controls.files | default([]) | length > 0 }}

- name: Persist AMD CPU controls with systemd-tmpfiles
  ansible.builtin.template:
    src: amd-cpu-tmpfiles.conf.j2
    dest: '{{ system_amd_tmpfiles_path }}'
    owner: root
    group: root
    mode: '0644'
  when: system_amd_persist_epp | bool or system_amd_persist_x3d | bool

- name: Remove persisted AMD CPU controls that Ansible no longer manages
  ansible.builtin.file:
    path: '{{ system_amd_tmpfiles_path }}'
    state: absent
  when: not (system_amd_persist_epp | bool or system_amd_persist_x3d | bool)
