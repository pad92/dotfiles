---
# The VPN is configured only from the Ansible Vault. Without it (fresh clone,
# CI) nothing is created, and files of an earlier run are left in place.
- name: Report that the VPN is not configured
  ansible.builtin.debug:
    msg: >-
      VPN skipped: vault_vpn_gateway_host is not defined. Add it to
      ansible/group_vars/all/vault_vpn.yml to manage the openfortivpn unit.
  when: system_vpn_gateway_host | length == 0

- name: Configure the SAML VPN
  when: system_vpn_gateway_host | length > 0
  block:
    # Each value lands in a key = value file or a JavaScript rule, so a stray
    # newline or quote could add settings; only plain names and numbers pass.
    - name: Validate the VPN settings
      ansible.builtin.assert:
        quiet: true
        that:
          - system_vpn_gateway_host is string
          - system_vpn_gateway_host is match('^' ~ label ~ '([.]' ~ label ~ ')*$')
          - system_vpn_gateway_host | length <= 253
          - system_vpn_gateway_port | string is match('^[0-9]{1,5}$')
          - system_vpn_gateway_port | int is ge(1) and system_vpn_gateway_port | int is le(65535)
          - system_vpn_saml_port | string is match('^[0-9]{1,5}$')
          - system_vpn_saml_port | int is ge(1024) and system_vpn_saml_port | int is le(65535)
          - system_vpn_name is match('^[a-z0-9][a-z0-9_-]*$')
          - system_vpn_users is sequence and system_vpn_users is not string
          - system_vpn_users | length > 0
          - system_vpn_users | reject('match', '^[a-z_][a-z0-9_-]*$') | list | length == 0
        fail_msg: >-
          Invalid VPN settings: vault_vpn_gateway_host must be a DNS name,
          vault_vpn_gateway_port and system_vpn_saml_port port numbers (the SAML
          port above 1023), system_vpn_name a lowercase unit instance name and
          system_vpn_users a non-empty list of user names.
      vars:
        # One DNS label: letters, digits and inner hyphens.
        label: '[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?'

    - name: Check for the openfortivpn unit
      ansible.builtin.stat:
        path: '{{ system_unit_directory }}/openfortivpn@.service'
        get_checksum: false
      register: system_vpn_unit

    - name: Require openfortivpn
      ansible.builtin.assert:
        quiet: true
        that: system_vpn_unit.stat.exists
        fail_msg: >-
          {{ system_unit_directory }}/openfortivpn@.service is missing. Install
          openfortivpn (packages tag, group 23_vpn), then run the vpn tag
          again.

    - name: Create the openfortivpn configuration directory
      ansible.builtin.file:
        path: '{{ system_vpn_config_dir }}'
        state: directory
        owner: root
        group: root
        mode: '0755'

    # Only root reads the daemon configuration.
    - name: Write the openfortivpn configuration
      ansible.builtin.template:
        src: openfortivpn.conf.j2
        dest: '{{ system_vpn_config_dir }}/{{ system_vpn_name }}.conf'
        owner: root
        group: root
        mode: '0600'

    - name: Create the VPN unit drop-in directory
      ansible.builtin.file:
        path: '{{ system_vpn_unit_dropin_dir }}'
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Adapt the VPN unit to the browser login
      ansible.builtin.template:
        src: openfortivpn-unit.conf.j2
        dest: '{{ system_vpn_unit_dropin_dir }}/60-dotfiles-saml.conf'
        owner: root
        group: root
        mode: '0644'
      notify: Reload the systemd manager

    # polkitd watches rules.d and loads a changed rule on its own.
    - name: Let the session users start and stop the VPN unit
      ansible.builtin.template:
        src: vpn-polkit.rules.j2
        dest: '{{ system_vpn_polkit_rule }}'
        owner: root
        group: root
        mode: '0644'

    # Waybar runs as the user and opens the login URL in the browser.
    - name: Publish the VPN unit and login URL to Waybar
      ansible.builtin.template:
        src: vpn-waybar.json.j2
        dest: '{{ system_vpn_waybar_config }}'
        owner: root
        group: root
        mode: '0644'
