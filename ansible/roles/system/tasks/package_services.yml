---
- name: Select services for the selected package groups
  ansible.builtin.set_fact:
    system_selected_package_services: >-
      {{ system_package_services.get(ansible_facts['os_family'], {}) | dict2items
         | selectattr('key', 'in', packages_selected_groups)
         | map(attribute='value') | flatten | unique | sort }}

# A unit is enabled only once its package is installed, which also keeps check
# mode from failing before packages exist.
- name: Find unit files for the selected services
  ansible.builtin.stat:
    path: '{{ system_unit_directory }}/{{ item }}'
    get_checksum: false
  loop: '{{ system_selected_package_services }}'
  register: system_package_service_units

- name: Split installed and missing service units
  ansible.builtin.set_fact:
    system_package_services_to_enable: >-
      {{ system_package_service_units.results | selectattr('stat.exists')
         | map(attribute='item') | list }}
    system_package_services_missing: >-
      {{ system_package_service_units.results | rejectattr('stat.exists')
         | map(attribute='item') | list }}

- name: Report services whose package is not installed
  ansible.builtin.debug:
    msg: >-
      Not enabled because their unit file is missing:
      {{ system_package_services_missing | join(', ') }}
  when: system_package_services_missing | length > 0

- name: Enable and start services for the selected packages
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
    state: started
  loop: '{{ system_package_services_to_enable }}'

- name: Configure Docker group membership
  when: "'12_containers_docker' in packages_selected_groups"
  block:
    - name: Validate Docker group users
      ansible.builtin.assert:
        that:
          - item | length > 0
          - item != 'root'
        fail_msg: system_docker_group_users must list regular user names.
      loop: '{{ system_docker_group_users }}'

    - name: Read the docker group
      ansible.builtin.getent:
        database: group
        key: docker
        fail_key: false

    - name: Add users to the docker group
      ansible.builtin.user:
        name: '{{ item }}'
        groups: docker
        append: true
      loop: '{{ system_docker_group_users }}'
      when: ansible_facts.getent_group.docker is defined
      notify: Report group membership requires login
