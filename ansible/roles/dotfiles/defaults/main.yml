---
# Home and owner of the deployed files: the SSH user of the target, whose
# facts ansible/tasks/target.yml gathers without become.
dotfiles_home: "{{ ansible_facts['user_dir'] }}"
dotfiles_owner: "{{ ansible_facts['user_id'] }}"
dotfiles_group: "{{ ansible_facts['user_gid'] | string }}"
# Everything is copied and rendered from the controller's copy of the
# repository: the target keeps no link into a clone, which can be deleted
# once deployed. The submodules are initialized there, on the controller.
dotfiles_source_repository: '{{ role_path | dirname | dirname | dirname }}'
dotfiles_source_root: '{{ role_path }}/files/home'
# Where earlier versions linked .vim, .tmux and the Zsh tree. A link that
# still points there is replaced by a copy, and the files the programs had
# added to the clone (plugins, backups) are copied next to it.
dotfiles_legacy_link_root: '{{ dotfiles_home }}/.dotfiles/ansible/roles/dotfiles/files/home'
# Icon theme written into the GTK 2/3, hyprtoolkit and Mako configurations.
dotfiles_icon_theme: Papirus-Dark
# Mako does not follow theme inheritance, so it also searches the parent theme.
# The default only strips a -Dark suffix; set it to the Inherits= theme of the
# chosen theme's index.theme when that does not hold.
dotfiles_icon_theme_parent: "{{ dotfiles_icon_theme | regex_replace('-Dark$', '') }}"
dotfiles_zsh_dest: .local/share/dotfiles/zsh
dotfiles_zsh_home: '{{ dotfiles_home }}/{{ dotfiles_zsh_dest }}'
# Trees copied with only the files Git tracks. Their submodules are cloned on
# the target at the commit the controller's index records. Files a program
# adds there later (Vim and tmux plugins, Vim backups) stay in place, and a
# file that a later version no longer ships is deleted unless it was changed
# (see dotfiles_manifest_directory). A tree with copy: false has no files of
# its own: its directory is created, and a legacy link to it replaced.
dotfiles_trees:
  - src: .tmux
    dest: .tmux
    copy: false
  - src: .vim
    dest: .vim
  - src: zsh
    dest: '{{ dotfiles_zsh_dest }}'
# One manifest per copied directory lists the files deployed there with their
# SHA-1. The next deployment deletes the listed files that the repository no
# longer has, if they are still regular files with that checksum.
dotfiles_manifest_directory: '{{ dotfiles_home }}/.local/state/dotfiles/manifests'
# Plugin managers that update themselves with Git, so they are cloned on the
# target rather than copied. An existing checkout is left as it is.
dotfiles_plugin_managers:
  - repo: https://github.com/VundleVim/Vundle.vim.git
    dest: .vim/bundle/Vundle.vim
  - repo: https://github.com/tmux-plugins/tpm.git
    dest: .tmux/plugins/tpm
# Hyprlock background, copied from the repository into the home directory.
dotfiles_hyprlock_wallpaper_source: >-
  assets/wallpapers/wallpaper_arch_perfection_simplicity_by_icetremens-dbjspqh.png
dotfiles_hyprlock_wallpaper: >-
  .local/share/dotfiles/wallpapers/{{ dotfiles_hyprlock_wallpaper_source | basename }}
dotfiles_directories:
  - .bin
  - .config/alacritty
  - .config/awww
  - .config/fastfetch
  - .config/gtk-3.0
  - .config/htop
  - .config/hypr
  - .config/nvim
  - .config/nwg-look
  - .config/pipewire
  - .config/uwsm
  - .config/waybar
  - .config/wireplumber
  - .config/wlogout
  - .config/xdg-desktop-portal
  - .config/yamllint
  - .config/yay
dotfiles_directory_handlers:
  .config/hypr: [Restart Hyprlauncher]
  .config/pipewire: [Apply changed user audio configuration]
  .config/uwsm: [Report session restart required]
  .config/waybar: [Reload Waybar]
  .config/wireplumber: [Apply changed user audio configuration]
  .config/xdg-desktop-portal: [Restart XDG desktop portal]
# Handlers for single files whose program does not watch its configuration.
dotfiles_file_handlers:
  .config/hypr/hypridle.conf: [Restart hypridle]
  .config/hypr/hosts/settings.lua: [Reload Hyprland]
  # Hyprlauncher reads the hyprtoolkit theme only at startup.
  .config/hypr/hyprtoolkit.conf: [Restart Hyprlauncher]
  .config/mako/config: [Reload Mako configuration]
  .config/waybar/config: [Reload Waybar]
  .config/waybar/conf/temperature.json: [Reload Waybar]
dotfiles_systemd_directory: .config/systemd
# Set it to false in host_vars/<hostname>.yml to stop hypridle.
dotfiles_hypridle_enabled: true
# User unit links removed from the repository; deployment deletes them when
# they are still symlinks (paths are relative to the user systemd directory).
dotfiles_obsolete_user_unit_links:
  # Tracker 3 became localsearch, whose units are static and D-Bus activated.
  - gnome-session.target.wants/tracker-miner-fs-3.service
  - gnome-session.target.wants/tracker-miner-rss-3.service
dotfiles_systemd_graphical_units:
  - awww.service
  - awww_random.timer
  - hypridle.service
  - mako.service
  - waybar.service
dotfiles_files:
  - .gitconfig
  - .tmux.conf
  - .vimrc
  - .zprofile
  - .zshenv
  - .config/chrome-flags.conf
  - .config/chromium-flags.conf
  - .config/code-flags.conf
  - .config/codium-flags.conf
  - .config/electron-flags.conf
  - .config/user-dirs.conf
  - .config/user-dirs.locale
  - .config/autostart/nm-applet.desktop
  - .config/zed/keymap.json
  - .config/zed/tasks.json
dotfiles_templates:
  - src: home/.zshrc.j2
    dest: .zshrc
  - src: home/.config/hypr/hyprlock.conf.j2
    dest: .config/hypr/hyprlock.conf
  - src: home/.gtkrc-2.0.j2
    dest: .gtkrc-2.0
  - src: home/.config/gtk-3.0/settings.ini.j2
    dest: .config/gtk-3.0/settings.ini
  - src: home/.config/hypr/hyprtoolkit.conf.j2
    dest: .config/hypr/hyprtoolkit.conf
  - src: home/.config/mako/config.j2
    dest: .config/mako/config
  - src: home/.config/hypr/hypridle.conf.j2
    dest: .config/hypr/hypridle.conf
  - src: home/.config/hypr/hosts/settings.lua.j2
    dest: .config/hypr/hosts/settings.lua
  - src: home/.config/waybar/config.j2
    dest: .config/waybar/config
  - src: home/.config/waybar/conf/temperature.json.j2
    dest: .config/waybar/conf/temperature.json
# Mode of rendered files without their own mode in dotfiles_templates.
dotfiles_template_mode: '0644'

# Hardware. form_factor comes from the DMI chassis type; set
# dotfiles_is_portable in host_vars/<hostname>.yml when it is wrong.
dotfiles_portable_form_factors:
  - Convertible
  - Detachable
  - Hand Held
  - Laptop
  - Notebook
  - Portable
  - Sub Notebook
  - Tablet
dotfiles_is_portable: >-
  {{ ansible_facts.get('form_factor', '') in dotfiles_portable_form_factors }}

# hypridle timeouts in seconds. A suspend timeout of 0 never suspends.
dotfiles_hypridle_lock_timeout: 300
dotfiles_hypridle_dpms_timeout: 900
dotfiles_hypridle_suspend_timeout: 0

# Hyprland host settings, rendered into ~/.config/hypr/hosts/settings.lua.
# No resolution, scale or coordinate is set here: Hyprland picks the mode and
# the scale, and include/layout.lua computes the positions at run time from
# the size each connected monitor reports.
#
# Each monitor names one physical display and where it sits:
#   name: unique layout name, used by the relations and the rules below;
#   match: prefix of the EDID description that `hyprctl monitors all` prints
#     (Hyprland's "desc:" selector). Identical monitors get one entry each
#     with the same match and pair in connector order; add the serial number
#     to pin one. Or
#   internal: true for the built-in panel of a laptop;
#   right_of, left_of, above or below: at most one, the name of the
#     neighbour it shares an edge with. The first monitor without a relation
#     is the origin.
# A monitor that is not connected is skipped. A monitor whose neighbour is
# missing, or that no entry matches, joins the right edge of the layout, so
# the cursor can always reach every monitor.
dotfiles_hypr_monitors: []
# Mode policy for every monitor: preferred (the EDID's own mode), highrr
# (the highest refresh rate) or highres (the highest resolution).
dotfiles_hypr_monitor_mode: preferred
# hl.workspace_rule() tables: workspace, monitor (a layout name), default.
dotfiles_hypr_workspace_rules: []
# hl.window_rule() tables: match, monitor (a layout name).
dotfiles_hypr_window_rules: []
# Blur and shadows cost battery, so portable machines turn them off.
dotfiles_hypr_effects_enabled: '{{ not dotfiles_is_portable | bool }}'
# Layout name of the monitor a touchscreen maps to. Empty leaves it unset.
dotfiles_hypr_touch_monitor: ''

# Waybar. A temperature#<name> module is shown only when a sensor of that name
# is listed in dotfiles_waybar_temperature_sensors; the portable modules only
# on a portable machine.
dotfiles_waybar_modules_right:
  - custom/recording
  - custom/vpn
  - pulseaudio
  - bluetooth
  - cpu
  - temperature#cpu
  - memory
  - temperature#gpu
  - '{{ dotfiles_waybar_portable_modules if dotfiles_is_portable | bool else [] }}'
  - custom/lact-profile
  - custom/headsetcontrol
  - tray
dotfiles_waybar_portable_modules:
  - backlight
  - battery
# Each sensor: name, label (tooltip), hwmon_path (an absolute /sys path to the
# hwmon directory), input_filename (tempN_input) and optional
# critical_threshold. hwmon numbers change between boots, so use the stable
# device path that contains the hwmonN directory.
dotfiles_waybar_temperature_sensors: []
dotfiles_waybar_temperature_critical: 90
dotfiles_waybar_includes:
  - ~/.config/waybar/conf/system.json
  - ~/.config/waybar/conf/connectivity.json
  - ~/.config/waybar/conf/audio.json
  - ~/.config/waybar/conf/workspaces.json
  - ~/.config/waybar/conf/temperature.json
dotfiles_update_vim_plugins: false
dotfiles_vim_plugins:
  - repo: https://github.com/VundleVim/Vundle.vim.git
    dest: Vundle.vim
  - repo: https://github.com/morhetz/gruvbox.git
    dest: gruvbox
  - repo: https://github.com/airblade/vim-gitgutter.git
    dest: vim-gitgutter
  - repo: https://github.com/tpope/vim-fugitive.git
    dest: vim-fugitive
  - repo: https://github.com/suan/vim-instant-markdown.git
    dest: vim-instant-markdown
  - repo: https://github.com/chrisbra/colorizer.git
    dest: colorizer
  - repo: https://github.com/editorconfig/editorconfig-vim.git
    dest: editorconfig-vim
