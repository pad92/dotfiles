version: 7
daemon:
  log_level: info
  admin_group: wheel
  disable_clocks_cleanup: false

apply_settings_timer: 5
gpus: {}

profiles:
  Balance:
    gpus:
      1002:73df-1462:3980-0000:0d:00.0:
        performance_level: auto
        fan_control_enabled: true
        fan_control_settings:
          mode: curve
          static_speed: 0.5
          temperature_key: junction
          interval_ms: 500
          spindown_delay_ms: 3000
          change_threshold: 2
          curve:
            50: 0.2
            60: 0.3
            70: 0.45
            80: 0.65
            90: 0.9
            100: 1.0

  Silence:
    gpus:
      1002:73df-1462:3980-0000:0d:00.0:
        performance_level: auto
        fan_control_enabled: true
        fan_control_settings:
          mode: curve
          static_speed: 0.5
          temperature_key: junction
          interval_ms: 500
          spindown_delay_ms: 4000
          change_threshold: 3
          curve:
            55: 0.15
            65: 0.22
            75: 0.35
            85: 0.55
            95: 0.8
            103: 1.0

  Jeux-perf:
    gpus:
      1002:73df-1462:3980-0000:0d:00.0:
        performance_level: high
        fan_control_enabled: true
        fan_control_settings:
          mode: curve
          static_speed: 0.5
          temperature_key: junction
          interval_ms: 500
          spindown_delay_ms: 2000
          change_threshold: 2
          curve:
            45: 0.25
            55: 0.4
            65: 0.6
            75: 0.75
            85: 0.9
            95: 1.0

current_profile: Balance
auto_switch_profiles: false
