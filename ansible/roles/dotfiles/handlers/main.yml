---
- name: Reload the user systemd manager
  ansible.builtin.command:
    argv: [systemctl, --user, daemon-reload]
  changed_when: true
  become: false

- name: Read active states for managed user units
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    scope: user
  loop: >-
    {{ dotfiles_user_unit_copies.results | default([])
       | selectattr('changed') | map(attribute='item')
       | map('regex_replace', '\.d/.*$', '') | unique | list }}
  register: dotfiles_managed_user_unit_states
  changed_when: false
  become: false
  listen: Apply changed managed user units

- name: Apply changed active managed user units
  ansible.builtin.systemd_service:
    name: '{{ item.item }}'
    # Unit definitions (ExecStart, Environment, etc.) require a new process.
    state: restarted
    scope: user
  loop: '{{ dotfiles_managed_user_unit_states.results | default([]) }}'
  when: item.status.ActiveState | default('inactive') == 'active'
  become: false
  listen: Apply changed managed user units

- name: Read active states for user audio services
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    scope: user
  loop:
    - pipewire.service
    - pipewire-pulse.service
    - wireplumber.service
  register: dotfiles_user_audio_service_states
  changed_when: false
  become: false
  listen: Apply changed user audio configuration

- name: Apply changed active user audio services
  ansible.builtin.systemd_service:
    name: '{{ item.item }}'
    state: >-
      {{ 'reloaded'
         if item.status.CanReload | default('no') == 'yes'
         else 'restarted' }}
    scope: user
  loop: '{{ dotfiles_user_audio_service_states.results | default([]) }}'
  when: item.status.ActiveState | default('inactive') == 'active'
  become: false
  listen: Apply changed user audio configuration

- name: Restart Hyprlauncher
  ansible.builtin.shell:
    cmd: |
      if ! pgrep -x hyprlauncher >/dev/null; then
        exit 0
      fi

      pkill -TERM -x hyprlauncher || true
      attempts=0
      while pgrep -x hyprlauncher >/dev/null; do
        attempts=$((attempts + 1))
        if [ "$attempts" -ge 50 ]; then
          echo "Hyprlauncher did not stop after SIGTERM" >&2
          exit 1
        fi
        sleep 0.1
      done

      uwsm app -- hyprlauncher -d
    executable: /bin/sh
  changed_when: true
  become: false

- name: Reload Mako configuration
  ansible.builtin.shell:
    cmd: pgrep -x mako >/dev/null && makoctl reload
    executable: /bin/sh
  changed_when: true
  failed_when: false
  become: false
  tags: [mako_reload]

- name: Reload Waybar
  ansible.builtin.command:
    argv: [pkill, -USR2, -x, waybar]
  changed_when: true
  failed_when: false
  become: false
  tags: [waybar_reload]
