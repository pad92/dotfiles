---
- name: Reload the user systemd manager
  ansible.builtin.command:
    argv: [systemctl, --user, daemon-reload]
  changed_when: true
  become: false

- name: Apply changed managed user units
  ansible.builtin.command:
    argv: >-
      {{ ['systemctl', '--user', '--no-block', 'try-restart'] +
         (dotfiles_user_unit_copies.results | default([])
          | selectattr('changed') | map(attribute='item')
          | map('regex_replace', '\.d/.*$', '') | unique | list) }}
  changed_when: true
  become: false

- name: Apply changed user audio configuration
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - --no-block
      - try-reload-or-restart
      - pipewire.service
      - pipewire-pulse.service
      - wireplumber.service
  changed_when: true
  become: false

- name: Restart Hyprlauncher
  ansible.builtin.shell:
    cmd: |
      if ! pgrep -x hyprlauncher >/dev/null; then
        exit 0
      fi

      pkill -TERM -x hyprlauncher || true
      attempts=0
      while pgrep -x hyprlauncher >/dev/null; do
        attempts=$((attempts + 1))
        if [ "$attempts" -ge 50 ]; then
          echo "Hyprlauncher did not stop after SIGTERM" >&2
          exit 1
        fi
        sleep 0.1
      done

      uwsm app -t service -- hyprlauncher -d
    executable: /bin/sh
  changed_when: true
  become: false

- name: Reload Mako configuration
  ansible.builtin.shell:
    cmd: pgrep -x mako >/dev/null && makoctl reload
    executable: /bin/sh
  changed_when: true
  failed_when: false
  become: false
  tags: [mako_reload]

- name: Reload Waybar
  ansible.builtin.command:
    argv: [pkill, -USR2, -x, waybar]
  changed_when: true
  failed_when: false
  become: false
  tags: [waybar_reload]
