---
- name: Build managed path lists
  ansible.builtin.set_fact:
    dotfiles_link_destinations: >-
      {{ dotfiles_links | map(attribute='dest') | map('normpath') | list }}
    dotfiles_directory_paths: >-
      {{ (dotfiles_directories + [dotfiles_systemd_directory,
         dotfiles_systemd_directory + '/user']) | map('normpath') | list }}
    dotfiles_file_paths: >-
      {{ (dotfiles_files + (dotfiles_templates | map(attribute='dest') | list)
         + ['.config/waybar/config',
            '.config/hypr/hyprlock/carousel-image.sh']) | map('normpath') | list }}

- name: Combine managed paths
  ansible.builtin.set_fact:
    dotfiles_managed_paths: >-
      {{ (dotfiles_link_destinations + dotfiles_directory_paths +
          dotfiles_file_paths) | unique | list }}

- name: Build parent path list
  ansible.builtin.set_fact:
    dotfiles_parent_paths: >-
      {{ dotfiles_managed_paths | map('dirname') | reject('equalto', '.') |
         unique | list }}

- name: Inspect managed paths
  ansible.builtin.stat:
    path: '{{ dotfiles_home }}/{{ item }}'
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: '{{ dotfiles_managed_paths }}'
  register: dotfiles_target_stats
  loop_control:
    label: '{{ item }}'

- name: Inspect backup paths for conflicts
  ansible.builtin.stat:
    path: '{{ dotfiles_home }}/{{ item.item }}.bak'
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: '{{ dotfiles_target_stats.results }}'
  # Conflicting symlinks are moved too, so their targets stay recoverable.
  when:
    - item.stat.exists
    - >-
      (not item.stat.islnk and
       ((item.item in dotfiles_directory_paths and not item.stat.isdir) or
        item.item in dotfiles_link_destinations or
        (item.item in dotfiles_file_paths and item.stat.isdir))) or
      (item.stat.islnk and
       ((item.item in dotfiles_link_destinations and
         item.stat.lnk_source != dotfiles_source_root + '/' +
         (dotfiles_links | selectattr('dest', 'equalto', item.item) |
          map(attribute='src') | first)) or
        (item.item not in dotfiles_link_destinations and
         item.item != '.config/waybar/config')))
  register: dotfiles_backup_stats

- name: Refuse to replace existing backup paths
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: >-
      Refusing to replace {{ item.item.item }} because its backup path already
      exists.
  loop: '{{ dotfiles_backup_stats.results | default([]) }}'
  when: not item.skipped | default(false)
  loop_control:
    label: '{{ item.item.item }}'

- name: Back up conflicting managed paths without replacing existing backups
  dotfiles_backup:
    src: '{{ dotfiles_home }}/{{ item.item }}'
    dest: '{{ dotfiles_home }}/{{ item.item }}.bak'
  loop: >-
    {{ dotfiles_backup_stats.results | selectattr('stat', 'defined') |
       map(attribute='item') | list }}
  loop_control:
    label: '{{ dotfiles_home }}/{{ item.item }} -> {{ item.item }}.bak'
  register: dotfiles_conflict_backups

- name: Report paths moved into conflict backups # noqa: no-handler -- report results immediately.
  ansible.builtin.debug:
    msg: '{{ item.changed_files }}'
  loop: '{{ dotfiles_conflict_backups.results }}'
  loop_control:
    label: '{{ item.item.item }}'
  when: item.changed

- name: Explain deferred replacement during conflict simulation
  ansible.builtin.debug:
    msg: >-
      Check mode listed the conflict backups above. Replacement tasks are deferred
      because the original paths still exist; no files have been moved.
  when: ansible_check_mode and dotfiles_conflict_backups.changed

- name: Deploy paths after conflict backups
  when: not ansible_check_mode or not dotfiles_conflict_backups.changed
  block:
    - name: Create parent directories for managed paths
      ansible.builtin.file:
        path: '{{ dotfiles_home }}/{{ item }}'
        state: directory
        mode: '0755'
      loop: '{{ dotfiles_parent_paths }}'
      loop_control:
        label: '{{ item }}'

    - name: Link managed directories into the home directory
      ansible.builtin.file:
        src: '{{ dotfiles_source_root }}/{{ item.src }}'
        dest: '{{ dotfiles_home }}/{{ item.dest }}'
        state: link
        force: false
      loop: '{{ dotfiles_links }}'
      loop_control:
        label: '{{ item.dest }}'

    - name: Copy changed static dotfile directories
      ansible.builtin.include_tasks:
        file: copy-directory.yml
        apply:
          tags: [dotfiles, dotfiles_deploy]
      loop: "{{ dotfiles_directories | map('normpath') | unique | list }}"
      loop_control:
        loop_var: dotfiles_directory
        label: '{{ dotfiles_directory }}'

    - name: Copy static dotfiles
      ansible.builtin.copy:
        src: 'home/{{ item }}'
        dest: '{{ dotfiles_home }}/{{ item }}'
        mode: preserve
        backup: true
      loop: '{{ dotfiles_files }}'
      loop_control:
        label: '{{ item }}'

    - name: Render host-aware dotfiles
      ansible.builtin.template:
        src: '{{ item.src }}'
        dest: '{{ dotfiles_home }}/{{ item.dest }}'
        mode: preserve
        backup: true
      loop: '{{ dotfiles_templates }}'
      loop_control:
        label: '{{ item.dest }}'
      register: dotfiles_template_renders

    # A looped task notifies its handlers once any item changes, even when the
    # notify list is templated per item, so select them from the changed items.
    - name: Notify handlers for changed rendered dotfiles
      ansible.builtin.debug:
        msg: '{{ dotfiles_changed_template_handlers }}'
      vars:
        dotfiles_changed_templates: >-
          {{ dotfiles_template_renders.results | default([]) | selectattr('changed')
             | map(attribute='item.dest') | map('normpath') | list }}
        dotfiles_changed_template_handlers: >-
          {{ dotfiles_file_handlers | dict2items
             | selectattr('key', 'in', dotfiles_changed_templates)
             | map(attribute='value') | flatten | unique | list }}
      changed_when: dotfiles_changed_template_handlers | length > 0
      when: dotfiles_changed_template_handlers | length > 0
      notify: '{{ dotfiles_changed_template_handlers }}'

    - name: Render the Hyprlock carousel helper
      ansible.builtin.template:
        src: home/.config/hypr/hyprlock/carousel-image.sh.j2
        dest: '{{ dotfiles_home }}/.config/hypr/hyprlock/carousel-image.sh'
        mode: preserve
        backup: true
      tags: [hyprlock_carousel]

    - name: Check for a host-specific Waybar configuration
      ansible.builtin.stat:
        path: '{{ dotfiles_home }}/.config/waybar/{{ dotfiles_waybar_host_config }}'
      register: dotfiles_waybar_host_stat

    - name: Select the host-specific Waybar configuration
      ansible.builtin.file:
        src: '{{ dotfiles_home }}/.config/waybar/{{ dotfiles_waybar_host_config }}'
        dest: '{{ dotfiles_home }}/.config/waybar/config'
        state: link
        force: true
      when: dotfiles_waybar_host_stat.stat.isreg | default(false)
      notify: Reload Waybar

    - name: Deploy user systemd units
      ansible.builtin.import_tasks: user_systemd.yml
      tags: [systemd]
