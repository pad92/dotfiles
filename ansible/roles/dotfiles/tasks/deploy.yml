---
# Before the rendered Waybar configuration, ~/.config/waybar/config was a
# link to a per-host config.<hostname> file. Such a link is only a selection,
# so it is removed rather than backed up; its target is left alone. It is
# removed only once no backup conflict can stop the run, and check mode
# reports it the same way as the real run.
- name: Inspect the Waybar configuration path
  ansible.builtin.stat:
    path: '{{ dotfiles_home }}/.config/waybar/config'
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: dotfiles_waybar_config_stat

- name: Recognize the legacy Waybar host selection link
  ansible.builtin.set_fact:
    dotfiles_waybar_legacy_link: >-
      {{ dotfiles_waybar_config_stat.stat.islnk | default(false) and
         dotfiles_waybar_config_stat.stat.lnk_source | dirname ==
         dotfiles_home ~ '/.config/waybar' and
         dotfiles_waybar_config_stat.stat.lnk_source | basename
         is match('config[.]') }}

- name: Build managed path lists
  ansible.builtin.set_fact:
    dotfiles_directory_paths: >-
      {{ (dotfiles_directories + (dotfiles_trees | map(attribute='dest') | list)
         + [dotfiles_systemd_directory, dotfiles_systemd_directory + '/user'])
         | map('normpath') | list }}
    dotfiles_file_paths: >-
      {{ (dotfiles_files + (dotfiles_templates | map(attribute='dest') | list)
         + ['.config/hypr/hyprlock/carousel-image.sh', dotfiles_hyprlock_wallpaper])
         | map('normpath') | list }}

- name: Combine managed paths
  ansible.builtin.set_fact:
    dotfiles_managed_paths: >-
      {{ (dotfiles_directory_paths + dotfiles_file_paths) | unique | list }}

- name: Build parent path list
  ansible.builtin.set_fact:
    dotfiles_parent_paths: >-
      {{ dotfiles_managed_paths | map('dirname') | reject('equalto', '.') |
         unique | list }}

- name: Inspect managed paths
  ansible.builtin.stat:
    path: '{{ dotfiles_home }}/{{ item }}'
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: '{{ dotfiles_managed_paths }}'
  register: dotfiles_target_stats
  loop_control:
    label: '{{ item }}'

# Vundle and tpm are gone. Before anything moves, check that their leftovers
# can be removed: the module fails, removing nothing, if a repository there
# holds local work or a backup it would write already exists. What is not a
# Git repository goes to <path>.bak instead of being deleted. Forced check
# mode keeps this a read; the removal itself runs below, once the legacy
# links are gone.
- name: Check that the Vundle and tpm leftovers can be removed
  dotfiles_retired_plugins:
    home: '{{ dotfiles_home }}'
    paths: '{{ dotfiles_retired_plugin_paths }}'
    parents: '{{ dotfiles_retired_plugin_parents }}'
  check_mode: true
  changed_when: false
  register: dotfiles_retired_plugins_plan

- name: List the Vundle and tpm leftovers to remove
  ansible.builtin.debug:
    msg: 'Would remove: {{ dotfiles_retired_plugins_plan.removed | join(", ") }}'
  when: ansible_check_mode and dotfiles_retired_plugins_plan.removed | length > 0

- name: List the Vundle and tpm leftovers to back up
  ansible.builtin.debug:
    msg: >-
      Would move to .bak: {{ dotfiles_retired_plugins_plan.backed_up | join(", ") }}
  when:
    - ansible_check_mode
    - dotfiles_retired_plugins_plan.backed_up | length > 0

# Earlier versions linked each tree into the target's clone. Such a link is
# replaced by a copy rather than backed up, since a backup would still point
# into the clone, and what programs added there is copied over (see below).
- name: Start the list of legacy tree links
  ansible.builtin.set_fact:
    dotfiles_legacy_tree_links: []

- name: Recognize legacy links of the trees into a clone
  ansible.builtin.set_fact:
    dotfiles_legacy_tree_links: '{{ dotfiles_legacy_tree_links + [item] }}'
  vars:
    dotfiles_tree_stat: >-
      {{ dotfiles_target_stats.results
         | selectattr('item', 'equalto', item.dest | normpath) | first }}
  loop: '{{ dotfiles_trees }}'
  loop_control:
    label: '{{ item.dest }}'
  when:
    - dotfiles_tree_stat.stat.islnk | default(false)
    - >-
      dotfiles_tree_stat.stat.lnk_source | normpath ==
      (dotfiles_legacy_link_root ~ '/' ~ item.src) | normpath

- name: Inspect backup paths for conflicts
  ansible.builtin.stat:
    path: '{{ dotfiles_home }}/{{ item.item }}.bak'
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: '{{ dotfiles_target_stats.results }}'
  # Conflicting symlinks are moved too, so their targets stay recoverable.
  when:
    - item.stat.exists
    - >-
      (not item.stat.islnk and
       ((item.item in dotfiles_directory_paths and not item.stat.isdir) or
        (item.item in dotfiles_file_paths and item.stat.isdir))) or
      (item.stat.islnk and
       not (item.item == '.config/waybar/config' and
            dotfiles_waybar_legacy_link | bool) and
       item.item not in dotfiles_legacy_tree_links | map(attribute='dest')
                        | map('normpath'))
  register: dotfiles_backup_stats

- name: Refuse to replace existing backup paths
  ansible.builtin.assert:
    that:
      - not item.stat.exists
    fail_msg: >-
      Refusing to replace {{ item.item.item }} because its backup path already
      exists.
  loop: '{{ dotfiles_backup_stats.results | default([]) }}'
  when: not item.skipped | default(false)
  loop_control:
    label: '{{ item.item.item }}'

- name: Back up conflicting managed paths without replacing existing backups
  dotfiles_backup:
    src: '{{ dotfiles_home }}/{{ item.item }}'
    dest: '{{ dotfiles_home }}/{{ item.item }}.bak'
  loop: >-
    {{ dotfiles_backup_stats.results | selectattr('stat', 'defined') |
       map(attribute='item') | list }}
  loop_control:
    label: '{{ dotfiles_home }}/{{ item.item }} -> {{ item.item }}.bak'
  register: dotfiles_conflict_backups

- name: Report paths moved into conflict backups # noqa: no-handler -- report results immediately.
  ansible.builtin.debug:
    msg: '{{ item.changed_files }}'
  loop: '{{ dotfiles_conflict_backups.results }}'
  loop_control:
    label: '{{ item.item.item }}'
  when: item.changed

# Git lists, under each legacy link's target, what it does not track:
# files the programs wrote there, such as Vim backups. A nested
# repository, such as a plugin clone under .vim/bundle, comes as one entry.
- name: List the files programs added behind legacy tree links
  ansible.builtin.command:
    argv:
      - git
      - -c
      - core.quotePath=false
      - -C
      - '{{ dotfiles_legacy_link_root }}/{{ item.src }}'
      - ls-files
      - --others
  loop: '{{ dotfiles_legacy_tree_links }}'
  loop_control:
    label: '{{ item.dest }}'
  register: dotfiles_legacy_tree_files
  changed_when: false
  check_mode: false

- name: Explain deferred replacement during conflict simulation
  ansible.builtin.debug:
    msg: >-
      Check mode listed the conflict backups above. Replacement tasks are deferred
      because the original paths still exist; no files have been moved.
  when: ansible_check_mode and dotfiles_conflict_backups.changed

# Until a legacy link is removed, the copy would read and write through it
# into the clone, so check mode stops here too.
- name: Explain deferred replacement of legacy tree links
  ansible.builtin.debug:
    msg: >-
      Check mode stops before replacing the links to the clone
      ({{ dotfiles_legacy_tree_links | map(attribute='dest') | join(', ') }})
      with copies. Kept from the clone: {{ dotfiles_legacy_tree_files.results
      | map(attribute='stdout_lines') | flatten | join(', ') or 'nothing' }}.
  when: ansible_check_mode and dotfiles_legacy_tree_links | length > 0

- name: Deploy paths after conflict backups
  when: >-
    not ansible_check_mode or
    (not dotfiles_conflict_backups.changed and
     dotfiles_legacy_tree_links | length == 0)
  block:
    # Before the template, which would otherwise write through the link.
    - name: Remove the legacy Waybar host selection link
      ansible.builtin.file:
        path: '{{ dotfiles_home }}/.config/waybar/config'
        state: absent
      when: dotfiles_waybar_legacy_link | bool

    - name: Create parent directories for managed paths
      ansible.builtin.file:
        path: '{{ dotfiles_home }}/{{ item }}'
        state: directory
        mode: '0755'
      loop: '{{ dotfiles_parent_paths }}'
      loop_control:
        label: '{{ item }}'

    - name: Remove legacy tree links into a clone
      ansible.builtin.file:
        path: '{{ dotfiles_home }}/{{ item.dest }}'
        state: absent
      loop: '{{ dotfiles_legacy_tree_links }}'
      loop_control:
        label: '{{ item.dest }}'

    - name: Copy changed static dotfile directories and trees
      ansible.builtin.include_tasks:
        file: copy-directory.yml
        apply:
          tags: [dotfiles, dotfiles_deploy]
      vars:
        dotfiles_copy: >-
          {{ dotfiles_copy_item | combine({'tracked': true})
             if dotfiles_copy_item is mapping else
             {'src': dotfiles_copy_item, 'dest': dotfiles_copy_item} }}
      loop: >-
        {{ (dotfiles_directories | map('normpath') | unique | list)
           + dotfiles_trees }}
      loop_control:
        loop_var: dotfiles_copy_item
        label: '{{ dotfiles_copy_item.dest | default(dotfiles_copy_item) }}'

    # cp creates the missing parents of each path and keeps its modes, links
    # and nested Git checkouts; an existing path is left alone. The pinned
    # plugins are skipped with everything under them, since they are cloned
    # below: the Zsh plugins, which older versions shipped as submodules,
    # have a .git file that points into the clone. So are the Vundle and tpm
    # leftovers, which would only be removed again.
    # Git quotes a name with a newline or a quote, which then fails here
    # rather than copying another path.
    - name: Copy the files programs added behind legacy tree links
      ansible.builtin.command:
        argv:
          - cp
          - -a
          - --parents
          - --
          - '{{ dotfiles_added_path }}'
          - '{{ dotfiles_home }}/{{ item.0.item.dest }}/'
        chdir: '{{ dotfiles_legacy_link_root }}/{{ item.0.item.src }}'
        creates: '{{ dotfiles_home }}/{{ dotfiles_added_dest }}'
      vars:
        # Relative to the tree; a nested repository comes with a final slash.
        dotfiles_added_path: "{{ item.1 | regex_replace('/$', '') }}"
        dotfiles_added_dest: '{{ (item.0.item.dest ~ "/" ~ dotfiles_added_path) | normpath }}'
        dotfiles_cloned_paths: >-
          {{ (((dotfiles_zsh_plugins + dotfiles_vim_pack_plugins)
               | map(attribute='dest') | list)
              + dotfiles_retired_plugin_paths)
             | map('normpath') | list }}
      loop: >-
        {{ dotfiles_legacy_tree_files.results | default([])
           | subelements('stdout_lines', skip_missing=true) }}
      loop_control:
        label: '{{ dotfiles_added_dest }}'
      when: >-
        dotfiles_cloned_paths | length == 0 or
        dotfiles_added_dest is not match('(' ~ dotfiles_cloned_paths
                                         | map('regex_escape') | join('|')
                                         ~ ')(/|$)')

    # The check above already passed; this checks again, then removes.
    - name: Remove the Vundle and tpm leftovers
      dotfiles_retired_plugins:
        home: '{{ dotfiles_home }}'
        paths: '{{ dotfiles_retired_plugin_paths }}'
        parents: '{{ dotfiles_retired_plugin_parents }}'

    # Each plugin follows the commit pinned in dotfiles_zsh_plugins or
    # dotfiles_vim_pack_plugins: a new pin moves an existing clone there.
    - name: Clone the Zsh and Vim plugins at their pinned commits
      ansible.builtin.git:
        repo: '{{ item.repo }}'
        dest: '{{ dotfiles_home }}/{{ item.dest }}'
        version: '{{ item.version }}'
        update: true
      loop: '{{ dotfiles_zsh_plugins + dotfiles_vim_pack_plugins }}'
      loop_control:
        label: '{{ item.dest }} at {{ item.version }}'

    - name: Copy the Hyprlock background
      ansible.builtin.copy:
        src: '{{ dotfiles_source_repository }}/{{ dotfiles_hyprlock_wallpaper_source }}'
        dest: '{{ dotfiles_home }}/{{ dotfiles_hyprlock_wallpaper }}'
        mode: '0644'
        backup: true

    - name: Copy static dotfiles
      ansible.builtin.copy:
        src: 'home/{{ item }}'
        dest: '{{ dotfiles_home }}/{{ item }}'
        mode: preserve
        backup: true
      loop: '{{ dotfiles_files }}'
      loop_control:
        label: '{{ item }}'

    - name: Render host-aware dotfiles
      ansible.builtin.template:
        src: '{{ item.src }}'
        dest: '{{ dotfiles_home }}/{{ item.dest }}'
        owner: '{{ dotfiles_owner }}'
        group: '{{ dotfiles_group }}'
        mode: '{{ item.mode | default(dotfiles_template_mode) }}'
        backup: true
      loop: '{{ dotfiles_templates }}'
      loop_control:
        label: '{{ item.dest }}'
      register: dotfiles_template_renders

    # A looped task notifies its handlers once any item changes, even when the
    # notify list is templated per item, so select them from the changed items.
    - name: Notify handlers for changed rendered dotfiles
      ansible.builtin.debug:
        msg: '{{ dotfiles_changed_template_handlers }}'
      vars:
        dotfiles_changed_templates: >-
          {{ dotfiles_template_renders.results | default([]) | selectattr('changed')
             | map(attribute='item.dest') | map('normpath') | list }}
        dotfiles_changed_template_handlers: >-
          {{ dotfiles_file_handlers | dict2items
             | selectattr('key', 'in', dotfiles_changed_templates)
             | map(attribute='value') | flatten | unique | list }}
      changed_when: dotfiles_changed_template_handlers | length > 0
      when: dotfiles_changed_template_handlers | length > 0
      notify: '{{ dotfiles_changed_template_handlers }}'

    - name: Render the Hyprlock carousel helper
      ansible.builtin.template:
        src: home/.config/hypr/hyprlock/carousel-image.sh.j2
        dest: '{{ dotfiles_home }}/.config/hypr/hyprlock/carousel-image.sh'
        owner: '{{ dotfiles_owner }}'
        group: '{{ dotfiles_group }}'
        mode: '0755'
        backup: true
      tags: [hyprlock_carousel]

    - name: Deploy user systemd units
      ansible.builtin.import_tasks: user_systemd.yml
      tags: [systemd]
