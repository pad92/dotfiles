---
# Checks out the submodules of the controller's repository, for a local Zsh or
# the tests. The deployment does not need them: it clones each submodule on
# the target at the commit the index records.
- name: Initialize Git submodules at their recorded revisions
  dotfiles_submodule_update:
    path: '{{ dotfiles_source_repository }}'
  delegate_to: localhost
  become: false
  run_once: true
  register: dotfiles_submodule_update

- name: Report changed submodule paths # noqa: no-handler -- report results immediately.
  ansible.builtin.debug:
    msg: '{{ dotfiles_submodule_update.changed_files }}'
  when: dotfiles_submodule_update.changed
