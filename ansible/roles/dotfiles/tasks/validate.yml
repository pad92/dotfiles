---
# Fail before any change when a setting is missing or malformed. Values from
# group_vars and the Vault end up in Lua, JSON and shell configuration.
- name: Validate the dotfiles settings
  ansible.builtin.assert:
    quiet: true
    that:
      - dotfiles_home is string
      - dotfiles_home is match('^/.+')
      - dotfiles_home | normpath != '/'
      - dotfiles_owner is match('^[A-Za-z0-9_][A-Za-z0-9_.-]*$')
      - dotfiles_group is match('^[A-Za-z0-9_][A-Za-z0-9_.-]*$')
      - dotfiles_template_mode is match('^0[0-7]{3}$')
      - dotfiles_is_portable | string | lower in ['true', 'false']
      - dotfiles_icon_theme is match('^[A-Za-z0-9._+-]+$')
      - dotfiles_hypridle_lock_timeout | string is match('^[0-9]+$')
      - dotfiles_hypridle_dpms_timeout | string is match('^[0-9]+$')
      - dotfiles_hypridle_suspend_timeout | string is match('^[0-9]+$')
      - dotfiles_hypr_monitors is sequence and dotfiles_hypr_monitors is not string
      - >-
        dotfiles_hypr_monitors | reject('mapping') | list | length == 0
      - >-
        dotfiles_hypr_monitor_names | map('string')
        | reject('match', '^[a-z0-9_-]+$') | list | length == 0
      - >-
        dotfiles_hypr_monitor_names | unique | list | length
        == dotfiles_hypr_monitors | length
      # Each monitor is found either by its EDID description or as the
      # built-in panel, never both.
      - >-
        dotfiles_hypr_monitors | rejectattr('match', 'defined')
        | rejectattr('internal', 'defined') | list | length == 0
      - >-
        dotfiles_hypr_monitors | selectattr('match', 'defined')
        | selectattr('internal', 'defined') | list | length == 0
      - >-
        dotfiles_hypr_monitors | selectattr('match', 'defined')
        | map(attribute='match') | reject('string') | list | length == 0
      - >-
        dotfiles_hypr_monitors | selectattr('match', 'defined')
        | map(attribute='match') | select('string') | reject('search', '\S')
        | list | length == 0
      # An unknown key would be ignored and the monitor silently misplaced.
      - >-
        dotfiles_hypr_monitors | map('dict2items') | flatten
        | map(attribute='key')
        | reject('in', ['name', 'match', 'internal'] + dotfiles_hypr_monitor_relations)
        | list | length == 0
      - >-
        dotfiles_hypr_monitors | selectattr('internal', 'defined')
        | map(attribute='internal') | reject('sameas', true) | list | length == 0
      # At most one neighbour, and it must be a known monitor.
      - >-
        dotfiles_hypr_monitors | map('dict2items')
        | map('selectattr', 'key', 'in', dotfiles_hypr_monitor_relations)
        | map('list') | map('length') | select('gt', 1) | list | length == 0
      - >-
        dotfiles_hypr_monitors | map('dict2items')
        | map('selectattr', 'key', 'in', dotfiles_hypr_monitor_relations)
        | map('list') | flatten | map(attribute='value')
        | reject('in', dotfiles_hypr_monitor_names) | list | length == 0
      # ...and not the monitor itself: each entry's neighbour, paired with its
      # name, must not be one and the same value.
      - >-
        dotfiles_hypr_monitors | map('dict2items')
        | map('selectattr', 'key', 'in', dotfiles_hypr_monitor_relations)
        | map('map', attribute='value') | map('join')
        | zip(dotfiles_hypr_monitor_names) | map('unique') | map('list')
        | map('length') | select('eq', 1) | list | length == 0
      - dotfiles_hypr_monitor_mode in ['preferred', 'highrr', 'highres']
      - >-
        dotfiles_hypr_workspace_rules | rejectattr('workspace', 'defined')
        | list | length == 0
      - >-
        (dotfiles_hypr_workspace_rules + dotfiles_hypr_window_rules)
        | rejectattr('monitor', 'defined') | list | length == 0
      - >-
        (dotfiles_hypr_workspace_rules + dotfiles_hypr_window_rules)
        | map(attribute='monitor') | reject('in', dotfiles_hypr_monitor_names)
        | list | length == 0
      - >-
        dotfiles_hypr_window_rules | rejectattr('match', 'mapping')
        | list | length == 0
      - >-
        dotfiles_hypr_touch_monitor in [''] + dotfiles_hypr_monitor_names
      - dotfiles_hypr_effects_enabled | string | lower in ['true', 'false']
      - dotfiles_waybar_temperature_sensors | reject('mapping') | list | length == 0
      - >-
        dotfiles_waybar_temperature_sensors | rejectattr('name', 'defined')
        | list | length == 0
      - >-
        dotfiles_waybar_temperature_sensors | rejectattr('label', 'defined')
        | list | length == 0
      - >-
        dotfiles_waybar_temperature_sensors | rejectattr('hwmon_path', 'defined')
        | list | length == 0
      - >-
        dotfiles_waybar_temperature_sensors
        | rejectattr('input_filename', 'defined') | list | length == 0
      - >-
        dotfiles_waybar_temperature_sensors | map(attribute='name')
        | map('string') | reject('match', '^[a-z0-9_-]+$') | list | length == 0
      - >-
        dotfiles_waybar_temperature_sensors | map(attribute='name') | unique
        | list | length == dotfiles_waybar_temperature_sensors | length
      - >-
        dotfiles_waybar_temperature_sensors | map(attribute='label')
        | reject('string') | list | length == 0
      - >-
        dotfiles_waybar_temperature_sensors | map(attribute='hwmon_path')
        | map('string') | reject('match', '^/sys/[A-Za-z0-9_.:/-]+$') | list | length == 0
      - >-
        dotfiles_waybar_temperature_sensors | map(attribute='hwmon_path')
        | map('string') | select('search', '[.][.]') | list | length == 0
      - >-
        dotfiles_waybar_temperature_sensors | map(attribute='input_filename')
        | map('string') | reject('match', '^temp[0-9]+_input$') | list | length == 0
    fail_msg: >-
      Invalid dotfiles settings. Check dotfiles_home (an absolute path other
      than /), dotfiles_template_mode (an octal string such as '0644'), the
      hypridle timeouts (whole seconds), dotfiles_hypr_monitors (a unique
      name, a non-blank match or internal: true, at most one right_of,
      left_of, above or below naming another monitor, no other key),
      dotfiles_hypr_monitor_mode
      (preferred, highrr or highres), the workspace and window rules and
      dotfiles_hypr_touch_monitor (each naming a monitor; window rules with a
      match mapping), and every entry
      of dotfiles_waybar_temperature_sensors (unique name, label, hwmon_path
      under /sys and input_filename tempN_input). See
      ansible/roles/dotfiles/README.md.
