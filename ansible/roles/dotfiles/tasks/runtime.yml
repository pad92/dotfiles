---
- name: Check for Vim
  ansible.builtin.command:
    argv: [vim, --version]
  when: dotfiles_update_vim_plugins | bool
  register: dotfiles_vim_check
  changed_when: false
  failed_when: false
  become: false
  tags: [vim]

- name: Update Vim plugins
  ansible.builtin.command:
    argv:
      - vim
      - -Nu
      - '{{ dotfiles_home }}/.vimrc'
      - -n
      - -es
      - -i
      - NONE
      - +PluginUpdate
      - +qall!
  when:
    - dotfiles_update_vim_plugins | bool
    - dotfiles_vim_check.rc == 0
  changed_when: true
  become: false
  tags: [vim]
