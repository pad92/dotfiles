---
- name: Collect directory contents including source links for {{ dotfiles_directory }}
  dotfiles_tree:
    path: '{{ dotfiles_source_root }}/{{ dotfiles_directory }}'
  delegate_to: localhost
  become: false
  register: dotfiles_directory_contents

- name: Inspect destination directory permissions
  ansible.builtin.stat:
    path: '{{ dotfiles_home }}/{{ item.path | relpath(dotfiles_source_root) }}'
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: '{{ dotfiles_directory_contents.files | selectattr("isdir") | list }}'
  loop_control:
    label: '{{ dotfiles_home }}/{{ item.path | relpath(dotfiles_source_root) }}'
  register: dotfiles_directory_stats

- name: Create destination subdirectories for {{ dotfiles_directory }}
  ansible.builtin.file:
    path: '{{ dotfiles_home }}/{{ item.item.path | relpath(dotfiles_source_root) }}'
    state: directory
    mode: '{{ item.stat.mode | default(item.item.mode) }}'
  loop: '{{ dotfiles_directory_stats.results }}'
  loop_control:
    label: '{{ dotfiles_home }}/{{ item.item.path | relpath(dotfiles_source_root) }}'
  notify: '{{ dotfiles_directory_handlers.get(dotfiles_directory, []) }}'

- name: Copy files individually from {{ dotfiles_directory }}
  ansible.builtin.copy:
    src: '{{ item.path }}'
    dest: >-
      {{ dotfiles_home }}/{{ item.path |
         relpath(dotfiles_source_root) }}
    mode: preserve
    backup: true
  loop: '{{ dotfiles_directory_contents.files | selectattr("isreg") | list }}'
  loop_control:
    label: >-
      {{ dotfiles_home }}/{{ item.path |
         relpath(dotfiles_source_root) }}
  register: dotfiles_directory_copies
  notify: '{{ dotfiles_directory_handlers.get(dotfiles_directory, []) }}'

# A looped task notifies the union of its handlers once any item changes, so
# file-specific handlers are selected from the changed items here.
- name: Notify handlers for changed files in {{ dotfiles_directory }}
  ansible.builtin.debug:
    msg: '{{ dotfiles_changed_file_handlers }}'
  vars:
    dotfiles_changed_files: >-
      {{ dotfiles_directory_copies.results | default([]) | selectattr('changed')
         | map(attribute='item.path') | map('relpath', dotfiles_source_root)
         | list }}
    dotfiles_changed_file_handlers: >-
      {{ dotfiles_file_handlers | dict2items
         | selectattr('key', 'in', dotfiles_changed_files)
         | map(attribute='value') | flatten | unique | list }}
  changed_when: dotfiles_changed_file_handlers | length > 0
  when: dotfiles_changed_file_handlers | length > 0
  notify: '{{ dotfiles_changed_file_handlers }}'

- name: Preserve dangling and cyclic source links in {{ dotfiles_directory }}
  ansible.builtin.file:
    src: '{{ item.lnk_target }}'
    path: '{{ dotfiles_home }}/{{ item.path | relpath(dotfiles_source_root) }}'
    state: link
    follow: false
    force: false
  loop: '{{ dotfiles_directory_contents.files | selectattr("islnk") | list }}'
  loop_control:
    label: '{{ dotfiles_home }}/{{ item.path | relpath(dotfiles_source_root) }}'
  notify: '{{ dotfiles_directory_handlers.get(dotfiles_directory, []) }}'
