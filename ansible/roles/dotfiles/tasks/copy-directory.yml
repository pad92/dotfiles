---
# Copies one directory of files/home, given as dotfiles_copy:
#   src      path under files/home;
#   dest     path under the home directory;
#   tracked  true to copy only what Git tracks (see the dotfiles_tree module).
# The dotfiles_tree module gives each entry the path of its copy (dest) and
# the SHA-1 of each file.
- name: Resolve the source and handlers of {{ dotfiles_copy.dest }}
  ansible.builtin.set_fact:
    dotfiles_copy_source: "{{ (dotfiles_source_root ~ '/' ~ dotfiles_copy.src) | normpath }}"
    dotfiles_copy_handlers: '{{ dotfiles_directory_handlers.get(dotfiles_copy.dest, []) }}'
    dotfiles_copy_root: "{{ (dotfiles_home ~ '/' ~ dotfiles_copy.dest) | normpath }}"
    dotfiles_copy_manifest: >-
      {{ dotfiles_manifest_directory }}/{{ dotfiles_copy.dest | normpath
         | replace('/', '%2F') }}.json

- name: Collect directory contents including source links for {{ dotfiles_copy.dest }}
  dotfiles_tree:
    path: '{{ dotfiles_copy_source }}'
    dest: '{{ dotfiles_copy_root }}'
    tracked: '{{ dotfiles_copy.tracked | default(false) }}'
  delegate_to: localhost
  become: false
  register: dotfiles_directory_contents

- name: Inspect destination directory permissions
  ansible.builtin.stat:
    path: '{{ item.dest }}'
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: '{{ dotfiles_directory_contents.files | selectattr("isdir") | list }}'
  loop_control:
    label: '{{ item.dest }}'
  register: dotfiles_directory_stats

- name: Create destination subdirectories for {{ dotfiles_copy.dest }}
  ansible.builtin.file:
    path: '{{ item.item.dest }}'
    state: directory
    mode: '{{ item.stat.mode | default(item.item.mode) }}'
  loop: '{{ dotfiles_directory_stats.results }}'
  loop_control:
    label: '{{ item.item.dest }}'
  notify: '{{ dotfiles_copy_handlers }}'

- name: Copy files individually from {{ dotfiles_copy.dest }}
  ansible.builtin.copy:
    src: '{{ item.path }}'
    dest: '{{ item.dest }}'
    mode: preserve
    backup: true
  loop: '{{ dotfiles_directory_contents.files | selectattr("isreg") | list }}'
  loop_control:
    label: '{{ item.dest }}'
  register: dotfiles_directory_copies
  notify: '{{ dotfiles_copy_handlers }}'

- name: Preserve dangling and cyclic source links in {{ dotfiles_copy.dest }}
  ansible.builtin.file:
    src: '{{ item.lnk_target }}'
    path: '{{ item.dest }}'
    state: link
    follow: false
    force: false
  loop: '{{ dotfiles_directory_contents.files | selectattr("islnk") | list }}'
  loop_control:
    label: '{{ item.dest }}'
  notify: '{{ dotfiles_copy_handlers }}'

# Only the files the previous deployment listed are deleted, and only when
# they are still regular files with what it copied: a file added or changed
# by hand, or replaced by a link, stays (dotfiles_obsolete_files).
- name: Inspect the manifest of {{ dotfiles_copy.dest }}
  ansible.builtin.stat:
    path: '{{ dotfiles_copy_manifest }}'
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: dotfiles_copy_manifest_stat

- name: Read the manifest of {{ dotfiles_copy.dest }}
  ansible.builtin.slurp:
    src: '{{ dotfiles_copy_manifest }}'
  when: dotfiles_copy_manifest_stat.stat.exists
  register: dotfiles_copy_manifest_content

- name: List the files no longer shipped in {{ dotfiles_copy.dest }}
  ansible.builtin.set_fact:
    dotfiles_copy_files: >-
      {{ dict(dotfiles_directory_contents.files | selectattr('isreg')
              | map(attribute='dest')
              | zip(dotfiles_directory_contents.files | selectattr('isreg')
                    | map(attribute='checksum'))) }}
    dotfiles_copy_previous_manifest: >-
      {{ (dotfiles_copy_manifest_content.content | b64decode | from_json).files
         if dotfiles_copy_manifest_stat.stat.exists else {} }}

# Normalizing turns <root>/../x into a path outside the tree, which the next
# task then ignores.
- name: Normalize the paths of the manifest of {{ dotfiles_copy.dest }}
  ansible.builtin.set_fact:
    dotfiles_copy_previous_files: >-
      {{ dict(dotfiles_copy_previous_manifest.keys() | map('normpath')
              | zip(dotfiles_copy_previous_manifest.values())) }}

- name: Delete the unchanged files no longer shipped in {{ dotfiles_copy.dest }}
  dotfiles_obsolete_files:
    files: >-
      {{ dotfiles_copy_previous_files
         | dict2items
         | rejectattr('key', 'in', dotfiles_copy_files.keys() | list)
         | selectattr('key', 'match', (dotfiles_copy_root ~ '/') | regex_escape)
         | items2dict }}
  register: dotfiles_copy_deletions
  notify: '{{ dotfiles_copy_handlers }}'

# A looped task notifies the union of its handlers once any item changes, so
# file-specific handlers are selected from the files copied or deleted here.
# Their keys are paths under the home directory.
- name: Notify handlers for changed files in {{ dotfiles_copy.dest }}
  ansible.builtin.debug:
    msg: '{{ dotfiles_changed_file_handlers }}'
  vars:
    dotfiles_changed_files: >-
      {{ ((dotfiles_directory_copies.results | default([]) | selectattr('changed')
          | map(attribute='item.dest') | list)
         + dotfiles_copy_deletions.deleted)
         | map('relpath', dotfiles_home) | list }}
    dotfiles_changed_file_handlers: >-
      {{ dotfiles_file_handlers | dict2items
         | selectattr('key', 'in', dotfiles_changed_files)
         | map(attribute='value') | flatten | unique | list }}
  changed_when: dotfiles_changed_file_handlers | length > 0
  when: dotfiles_changed_file_handlers | length > 0
  notify: '{{ dotfiles_changed_file_handlers }}'

- name: Report the files no longer shipped but kept in {{ dotfiles_copy.dest }}
  ansible.builtin.debug:
    msg: '{{ item.path }} {{ item.reason }}, so it is kept.'
  loop: '{{ dotfiles_copy_deletions.kept }}'
  loop_control:
    label: '{{ item.path }}'

- name: Create the manifest directory for {{ dotfiles_copy.dest }}
  ansible.builtin.file:
    path: '{{ dotfiles_manifest_directory }}'
    state: directory
    mode: '0755'

- name: Record the files deployed in {{ dotfiles_copy.dest }}
  ansible.builtin.copy:
    content: "{{ {'dest': dotfiles_copy_root, 'files': dotfiles_copy_files} | to_nice_json }}\n"
    dest: '{{ dotfiles_copy_manifest }}'
    mode: '0644'
