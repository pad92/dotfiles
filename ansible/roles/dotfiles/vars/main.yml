---
# Values derived from the settings in defaults/main.yml and group_vars. The
# templates read only these resolved values, so they need no host logic.

dotfiles_hypr_config: >-
  {{ {} if dotfiles_hypr_effects_enabled | bool else
     {'decoration': {'blur': {'enabled': false},
                     'shadow': {'enabled': false}}} }}
# Layout names, which the workspace and window rules and the touchscreen use.
dotfiles_hypr_monitor_names: >-
  {{ dotfiles_hypr_monitors | map(attribute='name', default='') | list }}
# Keys of a monitor that name its neighbour, as include/layout.lua reads them.
dotfiles_hypr_monitor_relations: [right_of, left_of, above, below]

dotfiles_waybar_sensor_modules: >-
  {{ dotfiles_waybar_temperature_sensors | map(attribute='name')
     | map('regex_replace', '^', 'temperature#') | list }}
dotfiles_waybar_unused_sensor_modules: >-
  {{ dotfiles_waybar_modules_right | flatten | select('match', '^temperature#')
     | reject('in', dotfiles_waybar_sensor_modules) | list }}
dotfiles_waybar_active_modules_right: >-
  {{ dotfiles_waybar_modules_right | flatten
     | reject('in', dotfiles_waybar_unused_sensor_modules) | list }}
# JSON arrays for the Waybar config, indented for its top-level keys.
dotfiles_waybar_modules_right_json: >-
  {{ dotfiles_waybar_active_modules_right | to_nice_json(indent=2) | indent(2) }}
dotfiles_waybar_includes_json: >-
  {{ dotfiles_waybar_includes | to_nice_json(indent=2) | indent(2) }}
