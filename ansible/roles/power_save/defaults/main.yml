---
# HDA audio power saving, and opt-in Intel Wi-Fi power saving, written as
# module options. auto: only on a portable machine (DMI chassis type), where
# battery life matters more than the latency power saving adds. true or false
# forces it.
power_save_mode: auto
# Wi-Fi power saving is opt-in: power_save=1 with U-APSD can crash the Intel
# firmware ("Queue stuck", "Microcode SW error"), which breaks DNS and
# connectivity. Set true only on hardware known to be stable.
power_save_wifi: false
power_save_portable_form_factors:
  - Portable
  - Laptop
  - Notebook
  - Sub Notebook
  - Hand Held
  - Convertible
  - Detachable
  - Tablet
power_save_module_directory: /sys/module
# modprobe reads every file in lexical order and a later file overrides an
# earlier one, so the 00- prefix makes these options defaults that any local
# file (iwlwifi.conf, alsa.conf...) can override.
power_save_modprobe_path: /etc/modprobe.d/00-dotfiles-power-save.conf
# Earlier names of the options file, removed so they stop overriding local
# files.
power_save_legacy_modprobe_paths:
  - /etc/modprobe.d/zz-dotfiles-power-save.conf
# Options per loaded kernel module. Within a group, only the first loaded
# module gets its options: snd_hda_intel and snd_ac97_codec are the two audio
# codec drivers.
power_save_module_options:
  - modules: [snd_hda_intel, snd_ac97_codec]
    options:
      snd_hda_intel: [power_save=1]
      snd_ac97_codec: [power_save=1]
# Same layout, applied only when power_save_wifi is true. iwlmvm and iwldvm
# are the two Intel Wi-Fi firmware drivers.
power_save_wifi_module_options:
  - modules: [iwlwifi]
    options:
      iwlwifi: [power_save=1, uapsd_disable=0]
  - modules: [iwlmvm, iwldvm]
    options:
      iwlmvm: [power_scheme=3]
      iwldvm: [force_cam=0]
