---
# Example of ansible/group_vars/all/vault_gpg.yml, with placeholder values.
# Copy it there and encrypt it while it holds only placeholders, then
# replace every <...> value in the editor:
#   cp ansible/roles/gpg/vault_gpg.sample.yml ansible/group_vars/all/vault_gpg.yml
#   ansible-vault encrypt --vault-password-file .vault \
#     ansible/group_vars/all/vault_gpg.yml
#   ansible-vault edit --vault-password-file .vault \
#     ansible/group_vars/all/vault_gpg.yml
# Git ignores group_vars/all/vault*.yml. Every variable is optional; the role
# refuses the run while a key still holds its placeholder.

# Files of ~/.gnupg, as name.conf: [lines]. Listed files are replaced.
vault_gpg_config:
  common.conf:
    - use-keyboxd
  gpg.conf:
    - keyid-format 0xlong
    - with-fingerprint
  gpg-agent.conf:
    - default-cache-ttl 3600
    - max-cache-ttl 7200

# Keys imported when their fingerprint is missing from the keyring.
# armor: a secret key keeps its passphrase; a public key works too.
# trust (optional): undefined, never, marginal, full or ultimate.
vault_gpg_keys:
  - fingerprint: <40 uppercase hex characters of the key>
    armor: |
      <output of gpg --armor --export-secret-keys FINGERPRINT>
    trust: ultimate
