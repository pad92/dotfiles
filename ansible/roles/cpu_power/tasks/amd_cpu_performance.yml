---
- name: Validate AMD performance settings
  ansible.builtin.assert:
    that:
      - >-
        cpu_power_amd_pstate_epp is none or cpu_power_amd_pstate_epp in
        ['performance', 'balance_performance', 'balance_power', 'power']
      - cpu_power_amd_x3d_mode is none or cpu_power_amd_x3d_mode in ['frequency', 'cache']
    fail_msg: Choose a supported EPP preference and X3D mode, or null to leave them unchanged.

- name: Check for AMD P-State
  ansible.builtin.stat:
    path: /sys/devices/system/cpu/amd_pstate/status
  register: cpu_power_amd_pstate_control

- name: Read the AMD P-State mode
  ansible.builtin.slurp:
    src: /sys/devices/system/cpu/amd_pstate/status
  register: cpu_power_amd_pstate_status
  when: cpu_power_amd_pstate_control.stat.exists

- name: Read CPU power manager states
  ansible.builtin.include_tasks: power_manager_facts.yml

- name: Discover EPP controls on unmanaged AMD P-State CPUs
  ansible.builtin.find:
    paths: /sys/devices/system/cpu/cpufreq
    patterns: energy_performance_preference
    recurse: true
    file_type: file
  register: cpu_power_amd_epp_files
  when:
    - cpu_power_amd_pstate_epp is not none
    - cpu_power_amd_pstate_status.content | default('') | b64decode | trim == 'active'
    - cpu_power_active_managers | length == 0

- name: Configure each supported AMD EPP policy
  ansible.builtin.include_tasks:
    file: amd_epp_policy.yml
    apply:
      tags: [amd_cpu_performance]
  loop: '{{ cpu_power_amd_epp_files.files | default([]) }}'
  loop_control:
    loop_var: cpu_power_amd_policy
    label: '{{ cpu_power_amd_policy.path | dirname }}'

- name: Check for the AMD X3D driver
  ansible.builtin.stat:
    path: /sys/bus/platform/drivers/amd_x3d_vcache
  register: cpu_power_amd_x3d_driver
  when: cpu_power_amd_x3d_mode is not none

- name: Discover AMD X3D CCD controls without assuming a device instance
  ansible.builtin.find:
    paths: /sys/bus/platform/drivers/amd_x3d_vcache
    recurse: true
    follow: true
    depth: 2
    file_type: file
    patterns: amd_x3d_mode
  register: cpu_power_amd_x3d_controls
  when:
    - cpu_power_amd_x3d_mode is not none
    - cpu_power_amd_x3d_driver.stat.exists

- name: Read the discovered AMD X3D CCD modes
  ansible.builtin.slurp:
    src: '{{ item }}'
  loop: >-
    {{ cpu_power_amd_x3d_controls.files | default([]) | map(attribute='path') | list }}
  register: cpu_power_amd_x3d_current

- name: Set the requested AMD X3D CCD mode
  dotfiles_sysfs:
    path: '{{ item.item }}'
    value: '{{ cpu_power_amd_x3d_mode }}'
  loop: '{{ cpu_power_amd_x3d_current.results }}'
  loop_control:
    label: '{{ item.item }}'
  when:
    - item.content | b64decode | trim != cpu_power_amd_x3d_mode
