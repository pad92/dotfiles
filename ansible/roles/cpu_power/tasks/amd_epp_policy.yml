---
- name: Read available governors
  ansible.builtin.slurp:
    src: '{{ cpu_power_amd_policy.path | dirname }}/scaling_available_governors'
  register: cpu_power_amd_policy_governors

- name: Read the original policy governor
  ansible.builtin.slurp:
    src: '{{ cpu_power_amd_policy.path | dirname }}/scaling_governor'
  register: cpu_power_amd_policy_governor

- name: Validate the powersave governor
  ansible.builtin.assert:
    that:
      - "'powersave' in (cpu_power_amd_policy_governors.content | b64decode).split()"
    fail_msg: >-
      {{ cpu_power_amd_policy.path | dirname }} does not support the powersave governor.

- name: Read the original EPP preference
  ansible.builtin.slurp:
    src: '{{ cpu_power_amd_policy.path }}'
  register: cpu_power_amd_policy_original_epp

- name: Apply EPP preference for powersave governor
  block:
    - name: Select powersave at {{ (cpu_power_amd_policy.path | dirname) + '/scaling_governor' }}
      dotfiles_sysfs:
        path: '{{ cpu_power_amd_policy.path | dirname }}/scaling_governor'
        value: powersave
      when: cpu_power_amd_policy_governor.content | b64decode | trim != 'powersave'

    # AMD P-State exposes different EPP choices for each governor.
    - name: Read EPP preferences with the selected governor
      ansible.builtin.slurp:
        src: '{{ cpu_power_amd_policy.path | dirname }}/energy_performance_available_preferences'
      register: cpu_power_amd_policy_preferences

    - name: Validate the requested EPP preference
      ansible.builtin.assert:
        that:
          - >-
            cpu_power_amd_pstate_epp in
            (cpu_power_amd_policy_preferences.content | b64decode).split()
        fail_msg: >-
          {{ cpu_power_amd_policy.path | dirname }} does not support EPP
          {{ cpu_power_amd_pstate_epp }} with the powersave governor.
      when: not ansible_check_mode

    # Switching governors may also change EPP, so read it after the switch.
    - name: Read the current policy EPP preference
      ansible.builtin.slurp:
        src: '{{ cpu_power_amd_policy.path }}'
      register: cpu_power_amd_policy_epp

    - name: Set EPP preference at {{ cpu_power_amd_policy.path }}
      dotfiles_sysfs:
        path: '{{ cpu_power_amd_policy.path }}'
        value: '{{ cpu_power_amd_pstate_epp }}'
      when: cpu_power_amd_policy_epp.content | b64decode | trim != cpu_power_amd_pstate_epp
  rescue:
    - name: Restore governor at {{ (cpu_power_amd_policy.path | dirname) + '/scaling_governor' }}
      dotfiles_sysfs:
        path: '{{ cpu_power_amd_policy.path | dirname }}/scaling_governor'
        value: '{{ cpu_power_amd_policy_governor.content | b64decode | trim }}'
      when: cpu_power_amd_policy_governor.content | b64decode | trim != 'powersave'

    - name: Read EPP after restoring the governor
      ansible.builtin.slurp:
        src: '{{ cpu_power_amd_policy.path }}'
      register: cpu_power_amd_policy_restored_epp

    - name: Restore EPP preference at {{ cpu_power_amd_policy.path }}
      dotfiles_sysfs:
        path: '{{ cpu_power_amd_policy.path }}'
        value: '{{ cpu_power_amd_policy_original_epp.content | b64decode | trim }}'
      when: >-
        cpu_power_amd_policy_restored_epp.content | b64decode | trim !=
        cpu_power_amd_policy_original_epp.content | b64decode | trim

    - name: Report the EPP configuration failure
      ansible.builtin.fail:
        msg: >-
          Could not configure {{ cpu_power_amd_policy.path | dirname }} for EPP
          {{ cpu_power_amd_pstate_epp }}. The original governor and EPP were restored.
          Cause: {{ ansible_failed_result.msg | default(ansible_failed_task.name) }}
