---
# ~/.claude/settings.json also holds local permissions and session context
# that must never be versioned, so only the statusLine key is managed here.
- name: Look for the Claude Code binary
  ansible.builtin.command:
    argv: [sh, -c, 'command -v "$1"', sh, '{{ agent_cli_claude_binary }}']
  environment:
    # The native installer uses ~/.local/bin, which a non-login PATH may lack.
    PATH: "{{ agent_cli_home }}/.local/bin:{{ lookup('env', 'PATH') }}"
  register: agent_cli_claude_binary_lookup
  changed_when: false
  failed_when: false
  check_mode: false

- name: Configure the Claude Code status line
  when: agent_cli_claude_binary_lookup.rc == 0
  block:
    - name: Inspect Claude Code settings
      ansible.builtin.stat:
        path: '{{ agent_cli_home }}/{{ agent_cli_claude_settings }}'
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: agent_cli_claude_settings_stat

    - name: Read Claude Code settings
      ansible.builtin.slurp:
        src: '{{ agent_cli_home }}/{{ agent_cli_claude_settings }}'
      register: agent_cli_claude_settings_raw
      when: agent_cli_claude_settings_stat.stat.exists

    - name: Parse Claude Code settings
      ansible.builtin.set_fact:
        agent_cli_claude_settings_current: >-
          {{ agent_cli_claude_settings_raw.content | b64decode | from_json
             if agent_cli_claude_settings_stat.stat.exists else {} }}

    # Refuse to rewrite a file that is not a JSON object rather than lose it.
    - name: Require a JSON object in Claude Code settings
      ansible.builtin.assert:
        that:
          - agent_cli_claude_settings_current is mapping
        fail_msg: >-
          {{ agent_cli_home }}/{{ agent_cli_claude_settings }} is not a JSON
          object; fix it by hand before deploying the status line.
        quiet: true

    - name: Ensure the Claude Code directory exists
      ansible.builtin.file:
        path: '{{ (agent_cli_home ~ "/" ~ agent_cli_claude_settings) | dirname }}'
        state: directory
        mode: '0700'
      when: not agent_cli_claude_settings_stat.stat.exists

    - name: Merge the status line into Claude Code settings
      ansible.builtin.copy:
        dest: '{{ agent_cli_home }}/{{ agent_cli_claude_settings }}'
        content: >-
          {{ agent_cli_claude_settings_current
             | combine({'statusLine': agent_cli_claude_statusline})
             | to_nice_json(indent=2, sort_keys=false, ensure_ascii=false) }}
        mode: >-
          {{ agent_cli_claude_settings_stat.stat.mode
             if agent_cli_claude_settings_stat.stat.exists else '0600' }}
