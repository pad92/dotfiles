---
- name: Check for the GNOME keyring PAM module
  ansible.builtin.stat:
    path: '{{ gnome_keyring_pam_module }}'
    get_checksum: false
  register: gnome_keyring_module

- name: Report the missing GNOME keyring PAM module
  ansible.builtin.debug:
    msg: >-
      {{ gnome_keyring_pam_module }} is missing: install gnome-keyring to
      unlock the keyring at login.
  when: not gnome_keyring_module.stat.exists

- name: Add the GNOME keyring rules to the login PAM service
  when: gnome_keyring_module.stat.exists
  block:
    - name: Unlock the GNOME keyring at a TTY login
      community.general.pamd:
        name: '{{ gnome_keyring_pam_service }}'
        path: '{{ gnome_keyring_pam_directory }}'
        type: '{{ item.after_type }}'
        control: include
        module_path: system-local-login
        new_type: '{{ item.type }}'
        new_control: '{{ item.control }}'
        new_module_path: '{{ gnome_keyring_pam_module | basename }}'
        module_arguments: '{{ item.args }}'
        state: after
        backup: true
      loop: '{{ gnome_keyring_pam_rules }}'
      loop_control:
        label: '{{ item.type }}'

    # pamd changes nothing when the reference rule is missing, for example in
    # a login file that no longer includes system-local-login.
    - name: Read the login PAM service
      ansible.builtin.slurp:
        src: '{{ gnome_keyring_pam_directory }}/{{ gnome_keyring_pam_service }}'
      register: gnome_keyring_pam_file
      when: not ansible_check_mode

    - name: Report GNOME keyring rules that could not be added
      ansible.builtin.debug:
        msg: >-
          {{ gnome_keyring_pam_directory }}/{{ gnome_keyring_pam_service }} has
          no `include system-local-login` rule for: {{ gnome_keyring_pam_missing
          | join(', ') }}. Add the {{ gnome_keyring_pam_module | basename }}
          rules by hand.
      vars:
        gnome_keyring_pam_missing: >-
          {{ gnome_keyring_pam_rules | map(attribute='type')
             | reject('in', gnome_keyring_pam_file.content | b64decode
                      | regex_findall('(?m)^(-?\w+)\s+optional\s+'
                                      ~ (gnome_keyring_pam_module | basename
                                         | regex_escape)))
             | list }}
      when:
        - gnome_keyring_pam_file.content is defined
        - gnome_keyring_pam_missing | length > 0
