---
- name: Check for supported initramfs generators
  ansible.builtin.stat:
    path: '{{ item }}'
  loop:
    - /usr/bin/mkinitcpio
    - /usr/bin/dracut
  register: gpu_initramfs_tools
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_selected_groups is defined
  tags: [gpu_modules]

- name: Select the initramfs generator
  ansible.builtin.set_fact:
    gpu_initramfs_generator_effective: >-
      {{ gpu_initramfs_generator
         if gpu_initramfs_generator | default('auto') != 'auto'
         else ('mkinitcpio'
               if gpu_initramfs_tools.results[0].stat.exists
               else 'dracut') }}
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_selected_groups is defined
  tags: [gpu_modules]

- name: Validate initramfs generator selection
  ansible.builtin.assert:
    that:
      - gpu_initramfs_generator_effective in ['mkinitcpio', 'dracut']
      - gpu_initramfs_generator != 'auto' or
        (gpu_initramfs_tools.results[0].stat.exists !=
        gpu_initramfs_tools.results[1].stat.exists)
      - (gpu_initramfs_generator_effective == 'mkinitcpio' and
        gpu_initramfs_tools.results[0].stat.exists) or
        (gpu_initramfs_generator_effective == 'dracut' and
        gpu_initramfs_tools.results[1].stat.exists)
    fail_msg: >-
      Set gpu_initramfs_generator to mkinitcpio or dracut when detection
      is ambiguous or neither supported generator is installed.
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_selected_groups is defined
  tags: [gpu_modules]

- name: Configure hardware-detected hybrid runtime power management
  ansible.builtin.import_tasks: runtime_pm.yml
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_selected_groups is defined
  tags: [gpu_modules]

- name: Remove GPU module options written under earlier names
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop:
    - /etc/modprobe.d/zz-dotfiles-gpu.conf
    - /etc/modprobe.d/zz-dotfiles-i915.conf
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_selected_groups is defined
  notify: Regenerate Arch initramfs
  tags: [gpu_modules]

- name: Validate i915 GuC setting
  ansible.builtin.assert:
    that:
      - gpu_i915_enable_guc | string in ['-1', '0', '1', '2', '3']
      - "'08_intel_modern' in packages_selected_groups"
      - gpu_i915_enable_guc | string in ['-1', '0'] or
        gpu_i915_guc_supported is sameas true
    fail_msg: >-
      gpu_i915_enable_guc must be -1, 0, 1, 2, or 3 and requires the
      08_intel_modern profile. Values 1, 2, and 3 also require
      gpu_i915_guc_supported=true for verified compatible hardware.
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_selected_groups is defined
    - gpu_i915_enable_guc is not none
  tags: [gpu_modules]

- name: Configure GPU kernel module options for the selected profiles
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '0644'
  loop: '{{ gpu_modprobe_files }}'
  loop_control:
    label: '{{ item.dest }}'
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_selected_groups is defined
    - item.enabled | bool
  notify: Regenerate Arch initramfs
  tags: [gpu_modules]

- name: Remove GPU kernel module options the selected profiles do not need
  ansible.builtin.file:
    path: '{{ item.dest }}'
    state: absent
  loop: '{{ gpu_modprobe_files }}'
  loop_control:
    label: '{{ item.dest }}'
  when:
    - ansible_facts['os_family'] == 'Archlinux'
    - packages_selected_groups is defined
    - not item.enabled | bool
  notify: Regenerate Arch initramfs
  tags: [gpu_modules]
