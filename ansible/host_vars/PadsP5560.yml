---
# Laptop with hybrid Intel and NVIDIA graphics.
packages_host_groups: "{{ packages_workstation_groups + ['23_vpn'] }}"
hardening_ipv6_enabled: false
dotfiles_hypridle_enabled: false

# The laptop panel sits under the Dell.
dotfiles_hypr_monitors: >-
  {{ dotfiles_hypr_shared_monitors +
     [{'name': 'laptop', 'internal': true, 'below': 'dell'}] }}
dotfiles_hypr_workspace_rules: >-
  {{ dotfiles_hypr_shared_workspace_rules +
     [{'workspace': 8, 'monitor': 'laptop', 'default': true}] }}
dotfiles_hypr_touch_monitor: laptop
dotfiles_waybar_temperature_sensors:
  - name: cpu
    label: CPU
    hwmon_path: /sys/devices/platform/coretemp.0/hwmon
    input_filename: temp1_input
  - name: gpu
    label: GPU
    hwmon_path: >-
      /sys/devices/platform/PNP0C14:07/wmi_bus/wmi_bus-PNP0C14:07/8A42EA14-4F2A-FD45-6422-0087F7A7E608-25/hwmon
    input_filename: temp12_input
