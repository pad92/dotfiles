---
# Selections are keyed by the target's hostname fact.
packages_host_groups:
  PadsP5560:
    - 01_base
    - 02_fonts
    - 03_gtk
    - 04_printers
    - 10_sre_devops
    - 11_hyprland
    - 12_containers_docker
    - 14_iac_opentofu
    - 20_apps
  PadsTower:
    - 01_base
    - 02_fonts
    - 03_gtk
    - 04_printers
    - 10_sre_devops
    - 11_hyprland
    - 12_containers_docker
    - 14_iac_opentofu
    - 20_apps
    - 21_steam

# IPv6 is enabled by default; override it only on hosts that need it disabled.
system_ipv6_enabled_by_hostname:
  PadsP5560: false
  PadsTower: true

# Stop and disable hypridle on a host by setting its value to false.
dotfiles_hypridle_enabled_by_hostname:
  PadsP5560: false
  PadsTower: false
