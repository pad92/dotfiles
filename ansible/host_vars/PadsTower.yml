---
# Desktop with an AMD CPU.
packages_host_groups: "{{ packages_workstation_groups + ['21_steam'] }}"
dotfiles_hypridle_enabled: false
# Suspend after 1 h without input. The laptop leaves suspend to logind.
dotfiles_hypridle_suspend_timeout: 3600

# Highest refresh rate, for the ASUS gaming monitor.
dotfiles_hypr_monitor_mode: highrr
# Steam and games open on the ASUS gaming monitor.
dotfiles_hypr_window_rules:
  - match:
      class: ^(?i)(steam)$
      title: ^(?i)(Steam Big Picture Mode)$
    monitor: asus
  - match:
      class: ^(?i)(gamescope|steam_app_.*)$
    monitor: asus

dotfiles_waybar_temperature_sensors:
  - name: cpu
    label: CPU
    hwmon_path: /sys/devices/pci0000:00/0000:00:18.3/hwmon
    input_filename: temp1_input
  - name: gpu
    label: GPU
    hwmon_path: >-
      /sys/devices/pci0000:00/0000:00:03.1/0000:0b:00.0/0000:0c:00.0/0000:0d:00.0/hwmon
    input_filename: temp1_input
