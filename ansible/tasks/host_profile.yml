---
# Put this machine in the host_<hostname> group: Ansible then loads its
# settings from ansible/group_vars/host_<hostname>.yml on top of
# group_vars/all. A host without such a file keeps the role defaults.
# Characters that are not valid in a group name become underscores.
- name: Load the settings of this host
  ansible.builtin.group_by:
    key: >-
      host_{{ ansible_facts['hostname'] | regex_replace('[^A-Za-z0-9_]', '_') }}
  changed_when: false
  tags: [always]
