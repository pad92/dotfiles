---
# Settings shared by the workstations. host_vars/<hostname>.yml
# overrides any of them for one machine.

# Both workstations drive the same external monitors: the ASUS stands to the
# right of the Dell. Positions, modes and scales are computed at run time
# (see the dotfiles role README); only the relation is set here.
# The Dell is a 60 Hz monitor whose only 75 Hz modes are 1280x1024 and below,
# so a host-wide highrr policy must not reach it: it keeps its EDID mode.
dotfiles_hypr_shared_monitors:
  - name: dell
    match: Dell Inc. DELL P2423DE
    mode: preferred
  - name: asus
    match: ASUSTek COMPUTER INC XG32WCS
    right_of: dell
    # HDR10 panel: a 10-bit framebuffer for HDR games and films.
    bitdepth: 10
dotfiles_hypr_monitors: '{{ dotfiles_hypr_shared_monitors }}'
dotfiles_hypr_shared_workspace_rules:
  - workspace: 1
    monitor: asus
    default: true
  - workspace: 2
    monitor: dell
    default: true
dotfiles_hypr_workspace_rules: '{{ dotfiles_hypr_shared_workspace_rules }}'
