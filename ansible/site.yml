---
- name: Configure the Linux workstations
  hosts: all
  become: true
  gather_facts: false
  vars:
    # `--tags obs` alone is the OBS profile: OBS, its PipeWire/portal runtime,
    # the GPU drivers it encodes with and the browser virtual camera. Every
    # other role is skipped by the tag selection. ansible_run_tags is a tuple,
    # so it is turned into a list before the comparison.
    site_obs_only: "{{ ansible_run_tags | default([]) | list == ['obs'] }}"
    # Evaluated lazily, after the selection has classified the GPUs. Outside
    # the OBS profile it stays none, so the usual host selection applies.
    packages_group_selection: >-
      {{ (['22_obs'] + (packages_detected_graphics_groups | default([])))
         if site_obs_only | bool else none }}
    # The OBS profile adds its groups to the saved list instead of replacing it.
    packages_state_merge_selection: '{{ site_obs_only | bool }}'
  pre_tasks:
    # The OBS profile selects a few groups only, so a reconcile would treat
    # every other managed package as obsolete. This checks an argument, not
    # the host, so it runs before the facts are gathered.
    - name: Refuse package reconciliation from the OBS profile
      ansible.builtin.assert:
        that:
          - packages_action | default('install') != 'reconcile'
        fail_msg: >-
          packages_action=reconcile with --tags obs would treat every package
          outside 22_obs as obsolete. Reconcile without tags (make deploy).
      when: site_obs_only | bool
      tags: [always]

    - name: Gather the facts of the target
      ansible.builtin.import_tasks: tasks/target.yml
      tags: [always]

    - name: Require Arch Linux for the OBS profile
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Archlinux'
        fail_msg: The OBS profile only defines packages for Arch Linux and CachyOS.
      when: site_obs_only | bool
      tags: [always]

    - name: Require a supported Linux distribution family
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == 'Linux'
          - >-
            ansible_facts['os_family'] == 'Archlinux' or
            ansible_facts['distribution'] in ['Debian', 'Ubuntu', 'Fedora']
        fail_msg: >-
          This playbook currently supports Arch Linux/CachyOS, Debian/Ubuntu,
          and Fedora. Add package mappings before using another distribution.
      tags: [always]

    # Read-only. Several roles read packages_selected_groups, so it is computed
    # whatever tags are passed.
    - name: Select the package groups of this host
      ansible.builtin.include_role:
        name: packages
        tasks_from: selection
        apply:
          tags: [always]
      tags: [always]
  # One role per function. The plan action (packages_action=plan) is read-only
  # for the whole playbook, so every role that changes the host skips it. The
  # system tag still selects every role of the former system role. Each role
  # has one tag of its own; system and dotfiles group several roles.
  roles:
    - role: package_manager
      when: packages_action | default('install') != 'plan'
      tags: [package_manager]
    # The obs tag also runs this role, which installs the OBS profile groups.
    - role: packages
      tags: [packages, obs]
    - role: lact
      when: packages_action | default('install') != 'plan'
      tags: [system, lact]
    - role: gaming
      when:
        - packages_action | default('install') != 'plan'
        - ansible_facts["os_family"] == "Archlinux"
        - "'21_steam' in (packages_selected_groups | default([]))"
      tags: [system, gaming]
    - role: package_services
      when:
        - packages_action | default('install') != 'plan'
        - packages_selected_groups is defined
      tags: [system, package_services]
    - role: docker
      when:
        - packages_action | default('install') != 'plan'
        - "'12_containers_docker' in (packages_selected_groups | default([]))"
      tags: [system, docker]
    - role: hardening
      when: packages_action | default('install') != 'plan'
      tags: [system, hardening]
    - role: dns
      when: packages_action | default('install') != 'plan'
      tags: [system, dns]
    # Only hosts that select 23_vpn get the VPN, even though the Vault applies
    # to every host.
    - role: vpn
      when:
        - packages_action | default('install') != 'plan'
        - >-
          '23_vpn' in (packages_selected_groups |
          default(packages_host_groups | default(none) or []))
      tags: [system, vpn]
    - role: gpu
      when: packages_action | default('install') != 'plan'
      tags: [system, gpu]
    - role: cpu_power
      when: packages_action | default('install') != 'plan'
      tags: [system, cpu_power]
    - role: time_sync
      when: packages_action | default('install') != 'plan'
      tags: [system, time_sync]
    - role: power_save
      when: packages_action | default('install') != 'plan'
      tags: [system, power_save]
    - role: iwlwifi
      when: packages_action | default('install') != 'plan'
      tags: [system, iwlwifi]
    - role: wireless_regdom
      when:
        - packages_action | default('install') != 'plan'
        - ansible_facts['os_family'] == 'Archlinux'
      tags: [system, wireless_regdom]
    # Arch's login PAM file includes system-local-login; Debian and Fedora
    # configure pam_gnome_keyring through their own PAM tools.
    - role: gnome_keyring
      when:
        - packages_action | default('install') != 'plan'
        - ansible_facts['os_family'] == 'Archlinux'
        - gnome_keyring_pam_enabled | default(true) | bool
      tags: [system, gnome_keyring]
    - role: dotfiles
      become: false
      tags: [dotfiles]
    - role: audio
      become: false
      when: packages_action | default('install') != 'plan'
      tags: [dotfiles, audio]
    - role: agent_cli
      become: false
      tags: [dotfiles, agent_cli]
    - role: obs
      when: "'22_obs' in (packages_selected_groups | default([]))"
      tags: [obs]
    # The tag names the section; role names cannot start with a digit.
    - role: print3d
      when:
        - packages_action | default('install') != 'plan'
        - ansible_facts["os_family"] == "Archlinux"
        - "'24_3dprint' in (packages_selected_groups | default([]))"
      tags: [3dprint]
